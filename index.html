<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Vis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: only light;
  --ground:#eef1f3; --card:#ffffff; --card-2:#f6f8f9;
  --ink:#141b1f; --ink-2:#4a5860; --ink-3:#78878f;
  --line:#d8dfe3; --line-2:#e8edef;
  --accent:#d4541f; --accent-soft:#fbeee7;
  --good:#1d7a52; --bad:#b3341c;
  --band:#e8f2ec; --band-2:#cfe3d8;
  --shadow:0 1px 2px rgba(20,27,31,.06), 0 8px 24px -12px rgba(20,27,31,.18);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:32px 24px 80px; display:flex; flex-direction:column; gap:24px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 28px;
  border-bottom:2px solid var(--ink); padding-bottom:16px}
h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.02em}
.sub{color:var(--ink-2); font-size:14px; margin:2px 0 0}
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
.panel-hd{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:13px 18px;
  border-bottom:1px solid var(--line-2)}
.panel-hd h2{margin:0; font-size:12px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600}
.lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.note{font-size:11.5px; color:var(--ink-3)}
.btn{background:none; border:1px solid var(--line); color:var(--ink-2); font:inherit; font-size:12px;
  padding:4px 12px; border-radius:6px; cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.solid{background:var(--ink); border-color:var(--ink); color:var(--card); font-weight:600}
.btn.solid:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg a{padding:5px 12px; font-size:12.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
  border-left:1px solid var(--line)}
.seg a:first-child{border-left:none}
.seg a.on{background:var(--accent); color:#fff; font-weight:600}
.seg a:hover:not(.on){background:var(--card-2)}

/* ---------- the chart: time across, place down ---------- */
.body{padding:14px 18px 14px}
.axis{display:flex; gap:12px; padding-bottom:2px}
.gut{flex:0 0 128px; display:flex; flex-direction:column}
.days{flex:1 1 auto; min-width:0; display:flex}
.day{flex:1 1 0; text-align:center; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; border-left:1px solid var(--line-2); padding-bottom:3px}
.day:first-child{border-left:none}
.day.cut{color:var(--accent)}
.hd{display:flex; align-items:baseline; gap:9px; padding:2px 0 4px}
.hd b{font-size:14.5px; font-weight:600}
.hd small{font-size:10.5px; color:var(--ink-3)}
.res{margin-left:auto; display:flex; align-items:baseline; gap:5px}
.res b{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; line-height:1}
.res small{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.res em{font-style:normal; font-size:10.5px; color:var(--ink-3)}
.chart{display:flex; gap:12px}
.lane-lbl{display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  font-size:10.5px; font-weight:600; color:var(--ink-2); line-height:1.15; text-align:right}
.lane-lbl button{margin-top:2px; padding:1px 5px; border:1px solid var(--band-2); border-radius:4px;
  background:var(--band); color:var(--good); font-family:"IBM Plex Mono",monospace;
  font-size:9px; font-weight:600; white-space:nowrap; cursor:pointer}
.lane-lbl button.off{background:var(--card-2); border-color:var(--line); color:var(--ink-3)}
.lane-lbl button:hover{border-color:var(--accent); color:var(--accent)}
.plot{position:relative; flex:1 1 auto; min-width:0}
.svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.svg line{vector-effect:non-scaling-stroke}
.lane{stroke:var(--line-2); stroke-width:1}
.col{stroke:var(--line-2); stroke-width:1}
.band{fill:var(--band)}
.cap{position:absolute; font-size:8.5px; font-weight:600; color:var(--good);
  white-space:nowrap; padding-left:3px; pointer-events:none; opacity:.85}
.move{stroke:var(--ink); stroke-width:2; stroke-linecap:round}
.wait{stroke:var(--ink); stroke-width:2; stroke-dasharray:2 3; opacity:.6}
/* A prereq's stop and the next start need not meet. Where they do not, the gap
   is drawn for what it is rather than closed up. */
.link{stroke:var(--ink-3); stroke-width:1.5; stroke-dasharray:1 4; opacity:.75}
.link.back{stroke:var(--bad); opacity:.9; stroke-dasharray:3 3}
.tick{fill:var(--card); stroke:var(--ink); stroke-width:1.5}
.grab{stroke:transparent; stroke-width:13; stroke-linecap:round; cursor:ew-resize}
.grab:hover{stroke:var(--accent); opacity:.22}
.dot{position:absolute; width:0; height:0; color:var(--ink); cursor:pointer}
.dot b{position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50%;
  background:currentColor; display:block}
.dot.end b{left:-4.5px; top:-4.5px; width:9px; height:9px; box-shadow:0 0 0 2px var(--card)}
.dot span{position:absolute; left:7px; display:flex; align-items:center; gap:3px; white-space:nowrap;
  font-size:9.5px; font-weight:500; line-height:1.1}
.dot.s0 span{bottom:2px} .dot.s1 span{top:2px} .dot.s2 span{bottom:13px}
.dot.flip span{left:auto; right:7px; flex-direction:row-reverse}
.dot em{font-style:normal; color:var(--ink-3); font-weight:400}
.dot.end span{font-weight:600}
.dot:hover b{box-shadow:0 0 0 3px var(--accent-soft)}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding-top:14px; margin-top:10px;
  border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.sw{display:inline-block; width:11px; height:11px; border-radius:2px}
.sw.band{background:var(--band); border:1px solid var(--band-2)}
.sw.mv{width:16px; height:2px; border-radius:0; background:var(--ink-2)}
.sw.wt{width:16px; height:0; border-radius:0; border-top:2px dashed var(--ink-3)}
.sw.tk{width:7px; height:7px; border-radius:50%; background:var(--card); border:1.5px solid var(--ink)}
.i{display:inline-block; vertical-align:-2px; flex:0 0 auto}

/* ---------- the list ---------- */
/* Every task carries the same fields, so every row is the same grid and the
   columns line up down the page. That is only possible because a task now says
   when it starts and when it stops outright, rather than each kind of task
   needing its own controls. */
.tasks{padding:0 18px 18px}
.grid{display:grid; gap:0 8px; align-items:center;
  grid-template-columns:
    22px 24px minmax(120px,1fr) minmax(88px,150px)
    62px 92px 62px 92px 52px auto 22px 22px 22px 22px;}
.gh{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding:10px 0 6px; border-bottom:1px solid var(--line); white-space:nowrap}
.gh.r{text-align:right}
.row{display:contents}
.row>*{min-width:0}
.cell{padding:4px 0; border-bottom:1px solid var(--line-2); height:100%;
  display:flex; align-items:center; gap:3px}
.row.lit .cell{background:var(--accent-soft)}
.row.bad .cell{background:var(--accent-soft)}
.n{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); font-weight:600;
  justify-content:flex-end; padding-right:3px}
.ico{cursor:pointer; color:var(--ink-2); justify-content:center}
.ico:hover{color:var(--accent)}
.cell input,.cell select{width:100%; font-family:inherit; font-size:12.5px; padding:3px 6px;
  border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--ink)}
.cell input:focus,.cell select:focus{outline:none; border-color:var(--accent)}
.cell input.nm{font-weight:600}
.cell input[type=time],.cell select.dsel{font-family:"IBM Plex Mono",monospace; font-size:11px;
  padding:3px 2px}
.dur{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  justify-content:flex-end; white-space:nowrap}
/* A task that stops where it started is standing still, and that is the one
   thing on this screen worth spotting from across the room. */
.dur.still{color:var(--accent); font-weight:600}
.dur.bad{color:var(--bad); font-weight:600}
.mini{background:none; border:1px solid var(--line); color:var(--ink-3); font-family:inherit;
  font-size:11px; width:22px; height:22px; border-radius:5px; cursor:pointer; padding:0; line-height:1}
.mini:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.mini.x:hover{border-color:var(--bad); color:var(--bad)}
.mini:disabled{opacity:.35; cursor:default}
.mini.has{border-color:var(--ink-3); color:var(--ink-2)}
.afterwrap{position:relative; justify-content:flex-start}
.after{background:var(--card-2); border:1px solid var(--line); color:var(--ink-3); font-family:inherit;
  font-size:11px; padding:3px 8px; border-radius:11px; cursor:pointer; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.after.on{color:var(--ink-2); border-color:var(--ink-3)}
.after:hover{border-color:var(--accent); color:var(--accent)}
.pop{position:absolute; z-index:20; top:26px; right:0; width:280px; padding:9px;
  background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  display:flex; flex-wrap:wrap; gap:4px}
.pop[hidden]{display:none}
.chip{border:1px solid var(--line); background:var(--card); color:var(--ink-3); font-family:inherit;
  font-size:11px; padding:2px 8px; border-radius:11px; cursor:pointer; white-space:nowrap}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--card); font-weight:600}
.chip:hover:not(.on){border-color:var(--accent); color:var(--accent)}
.feeds{flex:1 1 100%; font-size:11px; color:var(--ink-3); padding-top:3px;
  border-top:1px solid var(--line-2); margin-top:2px}
.feeds b{color:var(--ink-2); font-weight:600}
.noterow{grid-column:3 / -1; padding:0 0 7px}
.noterow[hidden]{display:none}
.noterow input{width:100%; font-family:inherit; font-size:12px; padding:3px 7px;
  border:1px solid var(--line); border-radius:5px; background:var(--card-2); color:var(--ink-2)}
.noterow input:focus{outline:none; border-color:var(--accent); background:var(--card)}
.warn{margin:12px 18px 0; padding:9px 12px; border:1px solid var(--bad); border-radius:7px;
  background:var(--accent-soft); color:var(--bad); font-size:12.5px}

/* ---------- opening hours, which belong to a place ---------- */
/* A window is a fact about a door, not about a task: Costco receiving is open
   4 to 11 whether or not anything is driving towards it. */
.places{display:flex; flex-wrap:wrap; gap:8px; padding:11px 18px 14px; border-top:1px solid var(--line-2)}
.pl{display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:8px;
  padding:5px 9px; background:var(--card-2)}
.pl b{font-size:11.5px; font-weight:600; color:var(--ink-2)}
.pl input[type=time]{width:88px; font-family:"IBM Plex Mono",monospace; font-size:11px; padding:2px 2px;
  border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink)}
.pl .dash{color:var(--ink-3); font-size:11px}
.dcell{display:inline-flex; gap:1px}
.d{width:17px; height:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-3);
  font-family:inherit; font-size:9.5px; font-weight:600; border-radius:3px; cursor:pointer; padding:0}
.d.on{background:var(--good); border-color:var(--good); color:#fff}
.d:hover{border-color:var(--accent)}
@media (max-width:1150px){ .tasks{overflow-x:auto} .grid{min-width:1120px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Task Vis</h1>
      <p class="sub" id="sub">One flow at a time. Time runs across, place runs down — so a sloped bar is movement and a flat one is waiting.</p>
    </div>
  </header>

  <section class="panel">
    <div class="panel-hd">
      <h2>Flow</h2>
      <span class="seg" id="pick"></span>
      <span class="lbl">Day 0</span>
      <span class="seg" id="day"></span>
      <button class="btn" id="reset" style="margin-left:auto">Back to defaults</button>
    </div>
    <div class="body">
      <div class="axis" id="axis"></div>
      <div id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="places" id="places"></div>
  </section>

  <section class="panel">
    <div class="panel-hd">
      <h2>Tasks</h2>
      <span class="note" id="tnote"></span>
      <button class="btn solid" id="add" style="margin-left:auto">Add a task</button>
    </div>
    <div id="warn"></div>
    <div class="tasks" id="tasks"></div>
  </section>
</div>
<script>
(function () {
  "use strict";

  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var STORE = 'taskvis.flows.v3';

  var ICON = {
    box:   '<path d="M2 5.2 8 2.4l6 2.8v5.6L8 13.6 2 10.8z"/><path d="M2 5.2 8 8l6-2.8M8 8v5.6"/>',
    truck: '<path d="M1 4.5h8.2v6H1z"/><path d="M9.2 6.6h2.6L14.4 9v1.5H9.2z"/><circle cx="4.2" cy="11.6" r="1.5"/><circle cx="11.3" cy="11.6" r="1.5"/>',
    plane: '<path d="M1.6 8.4 14.4 3.6l-3 5.2 1.1 4.4-2.4-1.5-2.2 1.9-.4-3.1z"/>',
    ship:  '<path d="M2.4 9.6h11.2l-1.7 3.8H4.1z"/><path d="M4.3 9.6V5.8h7.4v3.8M8 5.8V3.2"/>',
    depot: '<path d="M1.8 6.8 8 3.4l6.2 3.4v6.4H1.8z"/><path d="M5.6 13.2V9h4.8v4.2"/>',
    store: '<path d="M2 6.4h12v6.8H2z"/><path d="M2 6.4 3.4 3h9.2L14 6.4"/><path d="M6.4 13.2V9.4h3.2v3.8"/>',
    clock: '<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/>'
  };
  var ICONS = ['box', 'truck', 'plane', 'ship', 'depot', 'store', 'clock'];
  function ico(k) {
    return '<svg class="i" viewBox="0 0 16 16" width="14" height="14" fill="none" ' +
      'stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">' +
      (ICON[k] || ICON.clock) + '</svg>';
  }

  // ── What a task is ────────────────────────────────────────────────────────
  // A start, a stop, and where it ends up. Both times are typed, in hours from
  // midnight on day 0, so every task carries exactly the same fields and the
  // list is one grid rather than a different set of controls per kind.
  //
  //   { id, name, place, icon, note, s, e, after: [ids] }
  //
  // Nothing is derived from the graph. `after` records what has to happen
  // first, which is what the links are drawn from, but it does NOT push times
  // about: the next start does not have to be the previous stop. A gap is a
  // gap and gets drawn as one; an overlap is two things happening at once,
  // which is often the truth and used to be inexpressible.
  //
  // Opening hours belong to a PLACE, not to a task. Costco receiving is open 4
  // to 11 whether or not anything is driving towards it.
  function defaults() {
    return [{
      id: 'kona-lettuce',
      name: 'Lettuce → Costco Kona',
      note: 'Our own box truck. No carrier at all, so the only thing between packing and the customer is who is awake.',
      days: ['Sun', 'Mon', 'Wed', 'Thu'],
      windows: {
        'Packhouse':   { days: [1,1,1,1,1,1,1], open: 6, close: 19 },
        'Costco Kona': { days: [0,1,1,1,1,1,1], open: 4, close: 11 }
      },
      tasks: [
        { id: 'pack',  name: 'Packing',          place: 'Packhouse',   icon: 'box',
          s: 10, e: 18, after: [],
          note: 'Ends at 6 PM, which is when the clock everything else answers to starts.' },
        { id: 'hold',  name: 'Waits for the crew', place: 'Packhouse', icon: 'clock',
          s: 18, e: 30, after: ['pack'],
          note: 'Nobody is at the packhouse overnight, so it stands here until six.' },
        { id: 'load',  name: 'Load the truck',   place: 'Packhouse',   icon: 'truck',
          s: 30, e: 31, after: ['hold'],
          note: 'A box truck cannot stand loaded overnight, so it is loaded right before it drives.' },
        { id: 'drive', name: 'Drive to Kona',    place: 'Costco Kona', icon: 'truck',
          s: 31, e: 33, after: ['load'] },
        { id: 'recv',  name: 'Costco receiving', place: 'Costco Kona', icon: 'store',
          s: 33, e: 33.5, after: ['drive'],
          note: 'Inside the 4–11 window, so it goes straight in.' }
      ]
    }];
  }

  var F = defaults(), S = { id: 'kona-lettuce', day: 'Sun' };
  try {
    var sv = JSON.parse(window.localStorage.getItem(STORE) || 'null');
    if (sv && sv.flows && sv.flows.length) F = sv.flows;
    if (sv && sv.pick) S = sv.pick;
  } catch (e) { /* nothing stored, or junk in the slot */ }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify({ flows: F, pick: S })); } catch (e) {}
  }
  function cur() {
    for (var i = 0; i < F.length; i++) if (F[i].id === S.id) return F[i];
    S.id = F[0].id;
    return F[0];
  }

  // ── Clock ─────────────────────────────────────────────────────────────────
  var SPAN = 3, ANCHOR = 'Sun';
  var dowIdx = function (n) { return DOW.indexOf(n); };
  function clock(h) {
    var t = ((Math.round(h * 4) / 4 % 24) + 24) % 24, hh = Math.floor(t);
    var mn = Math.round((t - hh) * 60), m = mn ? ':' + (mn < 10 ? '0' : '') + mn : '';
    return (hh % 12 === 0 ? 12 : hh % 12) + m + ' ' + (hh < 12 ? 'AM' : 'PM');
  }
  function dayOf(h) { return Math.floor(h / 24); }
  function dayName(d) { return DOW[((dowIdx(ANCHOR) + d) % 7 + 7) % 7]; }
  function stamp(h) { return dayName(dayOf(h)) + ' ' + clock(h); }
  function hhmm(h) {
    var t = ((h % 24) + 24) % 24, hr = Math.floor(t), mn = Math.round((t - hr) * 60);
    return (hr < 10 ? '0' : '') + hr + ':' + (mn < 10 ? '0' : '') + mn;
  }
  function fromHM(s) {
    var p = String(s || '').split(':'), h = parseFloat(p[0]), m = parseFloat(p[1] || 0);
    return isNaN(h) ? 0 : Math.max(0, Math.min(23.99, h + (isNaN(m) ? 0 : m / 60)));
  }
  function num(v, d) { var n = parseFloat(v); return isNaN(n) ? (d || 0) : n; }
  function dur(h) {
    var v = Math.round(h * 4) / 4;
    if (v <= 0) return '0 h';
    if (v < 1) return Math.round(v * 60) + ' m';
    return (Math.abs(v - Math.round(v)) < .01 ? Math.round(v) : v.toFixed(2).replace(/0$/, '')) + ' h';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function all(q) { return [].slice.call(document.querySelectorAll(q)); }
  function uid(p) { return p + Math.random().toString(36).slice(2, 7); }
  function cssId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, '\\$&'); }

  // ── Reading a flow ────────────────────────────────────────────────────────
  // There is nothing to solve: the times are already there. This only sorts,
  // works out the places, and finds the links worth drawing.
  function read(flow) {
    var byId = {};
    flow.tasks.forEach(function (t) { byId[t.id] = t; });
    var pts = flow.tasks.map(function (t) {
      return { id: t.id, t: t, s: num(t.s), e: num(t.e), place: t.place || 'Somewhere' };
    });
    var start = 0, end = 0;
    pts.forEach(function (p) {
      start = Math.min(start === 0 && !pts.length ? p.s : start, p.s);
      end = Math.max(end, p.e, p.s);
    });
    if (pts.length) start = Math.min.apply(null, pts.map(function (p) { return p.s; }));
    var idle = pts.reduce(function (a, p) { return a + Math.max(0, p.e - p.s); }, 0);
    var moving = 0, still = 0;
    pts.forEach(function (p, i) {
      var prev = null;
      (p.t.after || []).forEach(function (id) {
        if (byId[id] && (prev === null || num(byId[id].e) > num(byId[prev].e))) prev = id;
      });
      p.from = prev && byId[prev] ? (byId[prev].place || 'Somewhere') : p.place;
      if (p.from === p.place) still += Math.max(0, p.e - p.s); else moving += Math.max(0, p.e - p.s);
    });
    var edges = [];
    flow.tasks.forEach(function (t) {
      (t.after || []).forEach(function (id) {
        if (!byId[id]) return;
        edges.push({ from: id, to: t.id, h0: num(byId[id].e), h1: num(t.s),
                     p0: byId[id].place || 'Somewhere' });
      });
    });
    var broken = flow.tasks.filter(function (t) { return num(t.e) < num(t.s); });
    return { byId: byId, pts: pts, edges: edges, broken: broken,
             start: start, end: end, idle: Math.round(idle),
             still: Math.round(still), moving: Math.round(moving),
             days: dayOf(end) - dayOf(start), hrs: Math.round(end - start) };
  }
  function places(flow) {
    var seen = {}, out = [];
    flow.tasks.forEach(function (t) {
      var p = t.place || 'Somewhere';
      if (!seen[p]) { seen[p] = 1; out.push(p); }
    });
    return out;
  }
  function feedsOf(flow, id) {
    return flow.tasks.filter(function (t) { return (t.after || []).indexOf(id) >= 0; });
  }
  function winOf(flow, place) { return (flow.windows || {})[place] || null; }
  function winSpan(w) {
    var a = clock(num(w.open)), b = clock(num(w.close));
    return a.slice(-2) === b.slice(-2) ? a.slice(0, -3) + '–' + b : a + '–' + b;
  }

  // ── Drawing ───────────────────────────────────────────────────────────────
  var LANE_H = 38, PAD_T = 14, PAD_B = 18, PLOT_PX = 1040;
  var X = function (h) { return (h / (SPAN * 24)) * 1000; };
  var PCT = function (h) { return (h / (SPAN * 24)) * 100; };

  function chart(flow, r) {
    var lanes = places(flow), yOf = {};
    lanes.forEach(function (l, i) { yOf[l] = PAD_T + i * LANE_H + LANE_H / 2; });
    var H = PAD_T + lanes.length * LANE_H + PAD_B;

    var svg = '', caps = '', busy = {};
    for (var c = 1; c < SPAN; c++) {
      svg += '<line class="col" x1="' + X(c * 24) + '" x2="' + X(c * 24) + '" y1="0" y2="' + H + '"/>';
    }
    r.pts.forEach(function (p) { (busy[p.place] || (busy[p.place] = [])).push(PCT(p.e)); });
    lanes.forEach(function (l, i) {
      var y = PAD_T + i * LANE_H;
      svg += '<line class="lane" x1="0" x2="1000" y1="' + (y + LANE_H / 2) + '" y2="' + (y + LANE_H / 2) + '"/>';
      var w = winOf(flow, l);
      if (!w) return;
      var open = [];
      for (var d = 0; d < SPAN; d++) {
        if (!w.days[(dowIdx(ANCHOR) + d) % 7]) continue;
        open.push(d);
        var x0 = X(d * 24 + num(w.open)), x1 = X(d * 24 + num(w.close));
        svg += '<rect class="band" x="' + x0 + '" width="' + Math.max(0, x1 - x0) +
          '" y="' + (y + 5) + '" height="' + (LANE_H - 10) + '"><title>' + esc(l) + ' open ' +
          winSpan(w) + '</title></rect>';
      }
      if (!open.length) return;
      var mine = busy[l] || [], pick = open[0];
      for (var oi = 0; oi < open.length; oi++) {
        var px = PCT(open[oi] * 24 + num(w.open)), clear = true;
        for (var bi = 0; bi < mine.length; bi++) if (Math.abs(mine[bi] - px) < 15) clear = false;
        if (clear) { pick = open[oi]; break; }
      }
      caps += '<div class="cap" style="left:' + PCT(pick * 24 + num(w.open)) + '%;top:' + (y + 3) + 'px">' +
        esc(l) + ' open</div>';
    });

    // Links first, so a bar always sits on top of the thread that reached it.
    // A link that runs backwards means a task starts before what it comes after
    // has finished, which is allowed and is worth seeing.
    var link = '';
    r.edges.forEach(function (e) {
      if (Math.abs(e.h1 - e.h0) <= .01) return;
      link += '<line class="link' + (e.h1 < e.h0 ? ' back' : '') + '" x1="' + X(e.h0) +
        '" y1="' + yOf[e.p0] + '" x2="' + X(e.h1) + '" y2="' + yOf[e.p0] + '"/>';
    });

    var move = '', wait = '', grabs = '';
    r.pts.forEach(function (p) {
      var y1 = yOf[p.from] === undefined ? yOf[p.place] : yOf[p.from];
      var seg = 'x1="' + X(p.s) + '" y1="' + y1 + '" x2="' + X(p.e) + '" y2="' + yOf[p.place] + '"';
      var still = p.from === p.place;
      if (p.e - p.s > .01 || !still) {
        if (still) wait += '<line class="wait" ' + seg + '/>';
        else move += '<line class="move" ' + seg + '/>';
      }
      svg += '<circle class="tick" cx="' + X(p.s) + '" cy="' + y1 + '" r="2.6"><title>' +
        esc(p.t.name) + ' starts ' + stamp(p.s) + '</title></circle>';
      grabs += '<line class="grab" ' + seg + ' data-task="' + esc(p.id) + '"><title>' +
        esc(p.t.name) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' + dur(p.e - p.s) +
        '. Drag to move the whole task.</title></line>';
    });
    svg += link + wait + move + grabs;

    var dots = '', placed = {};
    r.pts.forEach(function (p) {
      var x = PCT(p.e), last = p.e === r.end;
      var nm = p.t.name || 'Task', tm = clock(p.e);
      var wpc = (30 + (nm.length + tm.length) * 5.3) / PLOT_PX * 100;
      var flip = x + wpc > 99;
      var lo = flip ? x - wpc : x, hi = flip ? x : x + wpc;
      var lane = placed[p.place] || (placed[p.place] = []), slot = 0;
      for (; slot < 3; slot++) {
        var free = true;
        for (var q = 0; q < lane.length; q++) {
          var o = lane[q];
          if (o.slot === slot && lo < o.hi + .5 && o.lo < hi + .5) { free = false; break; }
        }
        if (free) break;
      }
      lane.push({ lo: lo, hi: hi, slot: slot });
      var fed = feedsOf(flow, p.id);
      dots += '<div class="dot s' + slot + (last ? ' end' : '') + (flip ? ' flip' : '') +
        '" style="left:' + x + '%;top:' + yOf[p.place] + 'px" data-task="' + esc(p.id) + '"' +
        ' title="' + esc(nm) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' + dur(p.e - p.s) +
        (p.t.note ? '. ' + esc(p.t.note) : '') +
        (fed.length ? '. Feeds ' + esc(fed.map(function (x2) { return x2.name; }).join(', ')) : '') +
        '">' + '<b></b><span>' + ico(p.t.icon) + esc(nm) + '<em>' + tm + '</em></span></div>';
    });

    var lbl = lanes.map(function (l) {
      var w = winOf(flow, l);
      return '<div class="lane-lbl" style="height:' + LANE_H + 'px">' + esc(l) +
        '<button class="win' + (w ? '' : ' off') + '" data-place="' + esc(l) + '">' +
        (w ? winSpan(w) : 'no hours') + '</button></div>';
    }).join('');

    return '<div class="hd"><b>' + esc(flow.name) + '</b><small>' + esc(flow.note || '') + '</small>' +
      '<div class="res"><b>' + r.days + '</b><small>' + (r.days === 1 ? 'day' : 'days') + '</small>' +
      '<em>' + r.hrs + ' h end to end, ' + r.still + ' standing still</em></div></div>' +
      '<div class="chart"><div class="gut" style="padding-top:' + PAD_T + 'px">' + lbl + '</div>' +
      '<div class="plot" style="height:' + H + 'px">' +
      '<svg class="svg" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none">' + svg + '</svg>' +
      caps + dots + '</div></div>';
  }

  // ── The list ──────────────────────────────────────────────────────────────
  var COLS = ['', '', 'Task', 'Place', 'Starts', '', 'Stops', '', 'Takes', 'After', '', '', '', ''];
  function daySel(v, f) {
    var o = '';
    for (var d = 0; d < 7; d++) {
      o += '<option value="' + d + '"' + (d === v ? ' selected' : '') + '>' + dayName(d) + '</option>';
    }
    return '<select class="dsel" data-f="' + f + '">' + o + '</select>';
  }
  function row(t, i, flow, r) {
    var p = null;
    r.pts.forEach(function (x) { if (x.id === t.id) p = x; });
    var len = num(t.e) - num(t.s);
    var still = p && p.from === (t.place || 'Somewhere');
    var pre = (t.after || []).filter(function (id) { return r.byId[id]; });
    var afterLbl = !pre.length ? 'after —'
      : pre.length === 1 ? 'after ' + (r.byId[pre[0]].name || '?')
      : 'after ' + pre.length;
    var others = flow.tasks.filter(function (o) { return o.id !== t.id; });
    var fed = feedsOf(flow, t.id);
    var pop = '<div class="pop" hidden>' + (others.length
      ? others.map(function (o) {
          return '<button class="chip' + ((t.after || []).indexOf(o.id) >= 0 ? ' on' : '') +
            '" data-after="' + esc(o.id) + '">' + esc(o.name) + '</button>';
        }).join('')
      : '<span class="feeds">nothing else to depend on yet</span>') +
      '<div class="feeds">' + (fed.length
        ? 'Feeds <b>' + fed.map(function (o) { return esc(o.name); }).join('</b>, <b>') + '</b>'
        : 'Feeds nothing') + '</div></div>';

    return '<div class="row' + (len < 0 ? ' bad' : '') + '" id="task-' + esc(t.id) + '">' +
      '<div class="cell n">' + (i + 1) + '</div>' +
      '<div class="cell ico" data-ico="1" title="Change the icon">' + ico(t.icon) + '</div>' +
      '<div class="cell"><input class="nm" value="' + esc(t.name) + '" data-f="name" placeholder="Name"' +
      (t.note ? ' title="' + esc(t.note) + '"' : '') + '></div>' +
      '<div class="cell"><input value="' + esc(t.place) + '" data-f="place" list="places-list" placeholder="Place"></div>' +
      '<div class="cell">' + daySel(dayOf(num(t.s)), 'sday') + '</div>' +
      '<div class="cell"><input type="time" step="900" value="' + hhmm(num(t.s)) + '" data-f="stime"></div>' +
      '<div class="cell">' + daySel(dayOf(num(t.e)), 'eday') + '</div>' +
      '<div class="cell"><input type="time" step="900" value="' + hhmm(num(t.e)) + '" data-f="etime"></div>' +
      '<div class="cell dur' + (len < 0 ? ' bad' : still && len > .01 ? ' still' : '') + '">' +
      (len < 0 ? 'backwards' : dur(len)) + '</div>' +
      '<div class="cell afterwrap"><button class="after' + (pre.length ? ' on' : '') +
      '" title="What has to happen first">' + esc(afterLbl) + '</button>' + pop + '</div>' +
      '<div class="cell"><button class="mini' + (t.note ? ' has' : '') + '" data-note="1" title="' +
      (t.note ? esc(t.note) : 'Add a note') + '">&#9432;</button></div>' +
      '<div class="cell"><button class="mini" data-mv="-1" title="Move up"' +
      (i ? '' : ' disabled') + '>&#8593;</button></div>' +
      '<div class="cell"><button class="mini" data-mv="1" title="Move down"' +
      (i === flow.tasks.length - 1 ? ' disabled' : '') + '>&#8595;</button></div>' +
      '<div class="cell"><button class="mini x" data-del="1" title="Remove">&times;</button></div>' +
      '<div class="noterow" hidden><input value="' + esc(t.note || '') +
      '" data-f="note" placeholder="Why this task is here"></div>' +
      '</div>';
  }
  function blank(after, s) {
    return { id: uid('t'), name: 'New task', place: '', icon: 'clock',
             s: s, e: s + 1, after: after || [] };
  }

  // ── Gating on the hours ───────────────────────────────────────────────────
  // The times are typed, not solved, so a window cannot push them about. What
  // it can do is say when a typed time falls outside the door it belongs to,
  // and offer to move it to the next moment that door is open.
  function nextOpen(w, h) {
    for (var i = 0; i < 28; i++) {
      var d = Math.floor(h / 24) + i, dw = (dowIdx(ANCHOR) + d) % 7;
      if (!w.days[dw]) continue;
      var o = d * 24 + num(w.open), c = d * 24 + num(w.close);
      if (h <= o) return o;
      if (h < c) return h;
    }
    return h;
  }
  function outside(flow, place, h) {
    var w = winOf(flow, place);
    if (!w) return false;
    return nextOpen(w, h) !== h;
  }
  function offences(flow) {
    var out = [];
    flow.tasks.forEach(function (t) {
      var pl = t.place || 'Somewhere', w = winOf(flow, pl);
      if (!w) return;
      if (outside(flow, pl, num(t.s))) out.push({ t: t, f: 's', pl: pl });
      if (outside(flow, pl, num(t.e))) out.push({ t: t, f: 'e', pl: pl });
    });
    return out;
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function paint(chartOnly) {
    var flow = cur();
    if (flow.days.indexOf(S.day) < 0) S.day = flow.days[0];
    ANCHOR = S.day;

    var r = read(flow);
    SPAN = Math.max(2, Math.ceil(r.end / 24) + 1);

    var ax = '';
    for (var i = 0; i < SPAN; i++) {
      ax += '<div class="day' + (i === 0 ? ' cut' : '') + '">' + dayName(i) + '</div>';
    }
    document.getElementById('axis').innerHTML = '<div class="gut"></div><div class="days">' + ax + '</div>';
    document.getElementById('grid').innerHTML = chart(flow, r);
    document.getElementById('legend').innerHTML =
      '<span><i class="sw band"></i>a green box is one day of that place&rsquo;s opening hours</span>' +
      '<span><i class="sw mv"></i>moving</span>' +
      '<span><i class="sw wt"></i>standing still</span>' +
      '<span><i class="sw tk"></i>where a task starts</span>' +
      '<span class="note">Drag a bar to move the whole task. Click any bar or dot to find its row.</span>';
    document.getElementById('places').innerHTML = placeEditor(flow);

    var off = offences(flow);
    var warn = '';
    if (r.broken.length) {
      warn += '<div class="warn">' + r.broken.map(function (t) { return esc(t.name); }).join(', ') +
        ' stop' + (r.broken.length > 1 ? '' : 's') + ' before ' +
        (r.broken.length > 1 ? 'they' : 'it') + ' start' + (r.broken.length > 1 ? '' : 's') + '.</div>';
    }
    if (off.length) {
      warn += '<div class="warn">' + off.length + ' time' + (off.length > 1 ? 's fall' : ' falls') +
        ' outside the opening hours of the place ' + (off.length > 1 ? 'they belong' : 'it belongs') +
        ' to: ' + off.map(function (o) {
          return esc(o.t.name) + ' ' + (o.f === 's' ? 'starts' : 'stops') + ' ' +
                 stamp(num(o.f === 's' ? o.t.s : o.t.e));
        }).join('; ') + '. <button class="btn" id="snap">Move them to opening time</button></div>';
    }
    document.getElementById('warn').innerHTML = warn;

    document.getElementById('tnote').textContent =
      flow.tasks.length + ' tasks · ' + places(flow).length + ' places · ' + r.edges.length +
      ' links · ' + r.hrs + ' h end to end, ' + r.still + ' standing still';

    if (!chartOnly) {
      seg('pick', F.map(function (x) { return [x.id, x.name]; }), S.id,
        function (v) { S.id = v; save(); paint(); });
      seg('day', flow.days.map(function (d) { return [d, d]; }), S.day,
        function (v) { S.day = v; save(); paint(); });
      document.getElementById('tasks').innerHTML =
        '<datalist id="places-list">' + places(flow).map(function (p) {
          return '<option value="' + esc(p) + '">';
        }).join('') + '</datalist>' +
        '<div class="grid">' +
        COLS.map(function (c, i) {
          return '<div class="gh' + (i === 8 ? ' r' : '') + '">' + c + '</div>';
        }).join('') +
        flow.tasks.map(function (t, i) { return row(t, i, flow, r); }).join('') +
        '</div>';
    } else {
      flow.tasks.forEach(function (t) {
        var el = document.querySelector('#task-' + cssId(t.id) + ' .dur');
        if (!el) return;
        var len = num(t.e) - num(t.s), p = null;
        r.pts.forEach(function (x) { if (x.id === t.id) p = x; });
        el.textContent = len < 0 ? 'backwards' : dur(len);
        el.className = 'cell dur' + (len < 0 ? ' bad'
          : p && p.from === (t.place || 'Somewhere') && len > .01 ? ' still' : '');
      });
    }
    markOutside(flow);
    wire(flow, r);
  }
  // The offending inputs wear it, so the fix is where the mistake is.
  function markOutside(flow) {
    all('#tasks .row').forEach(function (rowEl) {
      var id = rowEl.id.replace(/^task-/, ''), t = null;
      flow.tasks.forEach(function (x) { if (x.id === id) t = x; });
      if (!t) return;
      var pl = t.place || 'Somewhere', w = winOf(flow, pl);
      [['stime', 's'], ['etime', 'e']].forEach(function (pair) {
        var el = rowEl.querySelector('[data-f="' + pair[0] + '"]');
        if (!el) return;
        var bad = w && outside(flow, pl, num(t[pair[1]]));
        el.style.borderColor = bad ? 'var(--bad)' : '';
        el.title = bad ? pl + ' is only open ' + winSpan(w) + ' on the days marked below the chart.' : '';
      });
    });
  }

  function placeEditor(flow) {
    return '<span class="lbl" style="align-self:center">Opening hours</span>' +
      places(flow).map(function (p) {
        var w = winOf(flow, p);
        if (!w) {
          return '<span class="pl"><b>' + esc(p) + '</b>' +
            '<button class="btn" data-addwin="' + esc(p) + '">set hours</button></span>';
        }
        return '<span class="pl" data-win="' + esc(p) + '"><b>' + esc(p) + '</b>' +
          '<span class="dcell">' + DOW.map(function (dn, d) {
            return '<button class="d' + (w.days[d] ? ' on' : '') + '" data-wday="' + d +
              '" title="' + dn + '">' + dn[0] + '</button>';
          }).join('') + '</span>' +
          '<input type="time" step="900" value="' + hhmm(num(w.open)) + '" data-wf="open">' +
          '<span class="dash">–</span>' +
          '<input type="time" step="900" value="' + hhmm(num(w.close)) + '" data-wf="close">' +
          '<button class="mini x" data-delwin="' + esc(p) + '" title="No hours for this place">&times;</button>' +
          '</span>';
      }).join('');
  }

  // ── Wiring ────────────────────────────────────────────────────────────────
  function wire(flow, r) {
    all('#tasks .row').forEach(function (rowEl) {
      var id = rowEl.id.replace(/^task-/, ''), t = null, idx = -1;
      flow.tasks.forEach(function (x, i) { if (x.id === id) { t = x; idx = i; } });
      if (!t) return;
      [].slice.call(rowEl.querySelectorAll('[data-f]')).forEach(function (el) {
        el.oninput = function () {
          var f = el.getAttribute('data-f');
          if (f === 'name' || f === 'place' || f === 'note') { t[f] = el.value; save(); paint(); return; }
          // Day and time are two halves of one number, so each edit rebuilds it
          // from whichever half did not change.
          if (f === 'sday') t.s = (+el.value) * 24 + (num(t.s) % 24);
          else if (f === 'stime') t.s = dayOf(num(t.s)) * 24 + fromHM(el.value);
          else if (f === 'eday') t.e = (+el.value) * 24 + (num(t.e) % 24);
          else if (f === 'etime') t.e = dayOf(num(t.e)) * 24 + fromHM(el.value);
          save(); paint(true);
        };
      });
      var ic = rowEl.querySelector('.ico');
      if (ic) ic.onclick = function () {
        t.icon = ICONS[(ICONS.indexOf(t.icon) + 1) % ICONS.length];
        save(); paint();
      };
      var ab = rowEl.querySelector('.after'), pop = rowEl.querySelector('.pop');
      if (ab) ab.onclick = function (ev) {
        ev.stopPropagation();
        var wasOpen = !pop.hidden;
        all('.pop').forEach(function (o) { o.hidden = true; });
        pop.hidden = wasOpen;
      };
      if (pop) pop.onclick = function (ev) { ev.stopPropagation(); };
      [].slice.call(rowEl.querySelectorAll('.chip')).forEach(function (b) {
        b.onclick = function (ev) {
          ev.stopPropagation();
          var dep = b.getAttribute('data-after');
          t.after = t.after || [];
          var k = t.after.indexOf(dep);
          if (k >= 0) t.after.splice(k, 1); else t.after.push(dep);
          save(); paint();
          var again = document.querySelector('#task-' + cssId(t.id) + ' .pop');
          if (again) again.hidden = false;
        };
      });
      var nb = rowEl.querySelector('[data-note]');
      if (nb) nb.onclick = function () {
        var nr = rowEl.querySelector('.noterow');
        nr.hidden = !nr.hidden;
        if (!nr.hidden) nr.querySelector('input').focus();
      };
      [].slice.call(rowEl.querySelectorAll('[data-mv]')).forEach(function (b) {
        b.onclick = function () {
          var d = +b.getAttribute('data-mv');
          if (idx + d < 0 || idx + d >= flow.tasks.length) return;
          var x = flow.tasks[idx]; flow.tasks[idx] = flow.tasks[idx + d]; flow.tasks[idx + d] = x;
          save(); paint();
        };
      });
      var del = rowEl.querySelector('[data-del]');
      if (del) del.onclick = function () {
        if (flow.tasks.length <= 1) return;
        flow.tasks.splice(idx, 1);
        // Close the chain over the hole: whatever depended on this inherits
        // what it depended on, so removing a step does not orphan the next one.
        var inherited = (t.after || []).slice();
        flow.tasks.forEach(function (o) {
          if ((o.after || []).indexOf(t.id) < 0) return;
          o.after = o.after.filter(function (x) { return x !== t.id; });
          inherited.forEach(function (x) {
            if (x !== o.id && o.after.indexOf(x) < 0) o.after.push(x);
          });
        });
        save(); paint();
      };
    });

    // Opening hours, which belong to the place rather than to any task.
    all('#places [data-win]').forEach(function (el) {
      var p = el.getAttribute('data-win'), w = flow.windows[p];
      [].slice.call(el.querySelectorAll('[data-wday]')).forEach(function (b) {
        b.onclick = function () {
          var d = +b.getAttribute('data-wday');
          w.days[d] = w.days[d] ? 0 : 1;
          save(); paint();
        };
      });
      [].slice.call(el.querySelectorAll('[data-wf]')).forEach(function (inp) {
        inp.oninput = function () { w[inp.getAttribute('data-wf')] = fromHM(inp.value); save(); paint(); };
      });
    });
    all('#places [data-addwin]').forEach(function (b) {
      b.onclick = function () {
        flow.windows = flow.windows || {};
        flow.windows[b.getAttribute('data-addwin')] = { days: [1,1,1,1,1,1,1], open: 8, close: 17 };
        save(); paint();
      };
    });
    all('#places [data-delwin]').forEach(function (b) {
      b.onclick = function () { delete flow.windows[b.getAttribute('data-delwin')]; save(); paint(); };
    });
    all('#grid .win').forEach(function (b) {
      b.onclick = function () {
        var el = document.querySelector('#places [data-win="' + b.getAttribute('data-place') + '"]') ||
                 document.querySelector('#places [data-addwin="' + b.getAttribute('data-place') + '"]');
        if (el) { el.scrollIntoView({ block: 'center' }); var i = el.querySelector('input'); if (i) i.focus(); }
      };
    });

    var snap = document.getElementById('snap');
    if (snap) snap.onclick = function () {
      offences(flow).forEach(function (o) {
        var w = winOf(flow, o.pl);
        o.t[o.f] = nextOpen(w, num(o.t[o.f]));
      });
      save(); paint();
    };

    all('#grid [data-task]').forEach(function (el) {
      el.addEventListener('click', function () {
        var c = document.getElementById('task-' + el.getAttribute('data-task'));
        if (!c) return;
        c.classList.add('lit');
        c.scrollIntoView({ block: 'center' });
        window.setTimeout(function () { c.classList.remove('lit'); }, 2600);
      });
      if (!el.classList.contains('grab')) return;
      // Dragging a bar slides the whole task, keeping its length. The times are
      // typed, so this is a way of typing them.
      el.addEventListener('mousedown', function (ev) {
        var t = r.byId[el.getAttribute('data-task')];
        if (!t) return;
        var W = el.ownerSVGElement.getBoundingClientRect().width, x0 = ev.clientX;
        var s0 = num(t.s), e0 = num(t.e);
        ev.preventDefault();
        function mv(e) {
          var d = Math.round(((e.clientX - x0) / W) * SPAN * 24 * 4) / 4;
          var ns = Math.max(0, s0 + d);
          if (ns === num(t.s)) return;
          t.e = ns + (e0 - s0);
          t.s = ns;
          paint(true);
        }
        function up() {
          window.removeEventListener('mousemove', mv);
          window.removeEventListener('mouseup', up);
          save(); paint();
        }
        window.addEventListener('mousemove', mv);
        window.addEventListener('mouseup', up);
      });
    });
  }

  function seg(id, opts, sel, cb) {
    var el = document.getElementById(id);
    el.innerHTML = opts.map(function (o) {
      return '<a data-v="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' class="on"' : '') +
        '>' + esc(o[1]) + '</a>';
    }).join('');
    [].slice.call(el.querySelectorAll('a')).forEach(function (a) {
      a.onclick = function () { cb(a.getAttribute('data-v')); };
    });
  }

  document.addEventListener('click', function () {
    all('.pop').forEach(function (o) { o.hidden = true; });
  });
  document.getElementById('add').onclick = function () {
    var flow = cur(), last = flow.tasks[flow.tasks.length - 1];
    var t = blank(last ? [last.id] : [], last ? num(last.e) : 8);
    t.place = last ? last.place : '';
    flow.tasks.push(t);
    save(); paint();
    var c = document.getElementById('task-' + t.id);
    if (c) { c.scrollIntoView({ block: 'center' }); c.querySelector('.nm').select(); }
  };
  document.getElementById('reset').onclick = function () {
    F = defaults(); S = { id: 'kona-lettuce', day: 'Sun' }; save(); paint();
  };

  paint();
})();
</script>
