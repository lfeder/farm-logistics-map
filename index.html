<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Vis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: only light;
  --ground:#eef1f3; --card:#ffffff; --card-2:#f6f8f9;
  --ink:#141b1f; --ink-2:#4a5860; --ink-3:#78878f;
  --line:#d8dfe3; --line-2:#e8edef;
  --accent:#d4541f; --accent-soft:#fbeee7;
  --good:#1d7a52; --bad:#b3341c;
  --band:#e8f2ec; --band-2:#cfe3d8;
  --shadow:0 1px 2px rgba(20,27,31,.06), 0 8px 24px -12px rgba(20,27,31,.18);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:32px 24px 80px; display:flex; flex-direction:column; gap:24px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 28px;
  border-bottom:2px solid var(--ink); padding-bottom:16px}
h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.02em}
.sub{color:var(--ink-2); font-size:14px; margin:2px 0 0}
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
.panel-hd{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:13px 18px;
  border-bottom:1px solid var(--line-2)}
.panel-hd h2{margin:0; font-size:12px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600}
.lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.note{font-size:11.5px; color:var(--ink-3)}
.btn{background:none; border:1px solid var(--line); color:var(--ink-2); font:inherit; font-size:12px;
  padding:4px 12px; border-radius:6px; cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.solid{background:var(--ink); border-color:var(--ink); color:var(--card); font-weight:600}
.btn.solid:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg a{padding:5px 12px; font-size:12.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
  border-left:1px solid var(--line)}
.seg a:first-child{border-left:none}
.seg a.on{background:var(--accent); color:#fff; font-weight:600}
.seg a:hover:not(.on){background:var(--card-2)}

/* ---------- the chart: time across, place down ---------- */
.body{padding:14px 18px 14px}
.axis{display:flex; gap:12px; padding-bottom:2px}
.gut{flex:0 0 116px; display:flex; flex-direction:column}
.days{flex:1 1 auto; min-width:0; display:flex}
.day{flex:1 1 0; text-align:center; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; border-left:1px solid var(--line-2); padding-bottom:3px}
.day:first-child{border-left:none}
.day.cut{color:var(--accent)}
.hd{display:flex; align-items:baseline; gap:9px; padding:2px 0 4px}
.hd b{font-size:14.5px; font-weight:600}
.hd small{font-size:10.5px; color:var(--ink-3)}
.res{margin-left:auto; display:flex; align-items:baseline; gap:5px}
.res b{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; line-height:1}
.res small{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.res em{font-style:normal; font-size:10.5px; color:var(--ink-3)}
.chart{display:flex; gap:12px}
.lane-lbl{display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  font-size:10.5px; font-weight:600; color:var(--ink-2); line-height:1.15; text-align:right}
.lane-lbl i{margin-top:2px; padding:1px 5px; border:1px solid var(--band-2); border-radius:4px;
  background:var(--band); color:var(--good); font-family:"IBM Plex Mono",monospace;
  font-size:9px; font-weight:600; font-style:normal; white-space:nowrap}
.plot{position:relative; flex:1 1 auto; min-width:0}
.svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.svg line{vector-effect:non-scaling-stroke}
.lane{stroke:var(--line-2); stroke-width:1}
.col{stroke:var(--line-2); stroke-width:1}
.band{fill:var(--band); cursor:pointer}
.band:hover{fill:var(--band-2)}
.cap{position:absolute; font-size:8.5px; font-weight:600; color:var(--good);
  white-space:nowrap; padding-left:3px; pointer-events:none; opacity:.85}
.move{stroke:var(--ink); stroke-width:2; stroke-linecap:round}
.wait{stroke:var(--ink); stroke-width:2; stroke-dasharray:2 3; opacity:.6}
/* Where a task begins, so a bar reads as a span rather than a line to a dot. */
.tick{fill:var(--card); stroke:var(--ink); stroke-width:1.5}
/* A prereq that finished early and waited for its siblings. */
.link{stroke:var(--ink-3); stroke-width:1.5; stroke-dasharray:1 4; opacity:.7}
.grab{stroke:transparent; stroke-width:13; stroke-linecap:round; cursor:pointer}
.grab.leg{cursor:ew-resize}
.grab.leg:hover{stroke:var(--accent); opacity:.22}
.grab.gate:hover{stroke:var(--good); opacity:.22}
.dot{position:absolute; width:0; height:0; color:var(--ink); cursor:pointer}
.dot b{position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50%;
  background:currentColor; display:block}
.dot.end b{left:-4.5px; top:-4.5px; width:9px; height:9px; box-shadow:0 0 0 2px var(--card)}
.dot span{position:absolute; left:7px; display:flex; align-items:center; gap:3px; white-space:nowrap;
  font-size:9.5px; font-weight:500; line-height:1.1}
.dot.s0 span{bottom:2px} .dot.s1 span{top:2px} .dot.s2 span{bottom:13px}
.dot.flip span{left:auto; right:7px; flex-direction:row-reverse}
.dot em{font-style:normal; color:var(--ink-3); font-weight:400}
.dot.end span{font-weight:600}
.dot:hover b{box-shadow:0 0 0 3px var(--accent-soft)}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding-top:14px; margin-top:10px;
  border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.sw{display:inline-block; width:11px; height:11px; border-radius:2px}
.sw.band{background:var(--band); border:1px solid var(--band-2)}
.sw.mv{width:16px; height:2px; border-radius:0; background:var(--ink-2)}
.sw.wt{width:16px; height:0; border-radius:0; border-top:2px dashed var(--ink-3)}
.sw.tk{width:7px; height:7px; border-radius:50%; background:var(--card); border:1.5px solid var(--ink)}
.i{display:inline-block; vertical-align:-2px; flex:0 0 auto}

/* ---------- the builder ---------- */
/* A task is one line. Every control says what it is by its own shape -- a time
   input looks like a time, seven letters look like days -- so the captions that
   used to sit above them were costing a row each to repeat the obvious. */
.tasks{padding:12px 18px 18px; display:flex; flex-direction:column; gap:6px}
.task{border:1px solid var(--line); border-radius:8px; background:var(--card); overflow:visible}
.task.lit{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.task.orphan{border-color:var(--bad); background:var(--accent-soft)}
.t-row{display:flex; align-items:center; gap:6px; padding:6px 9px; min-height:40px}
.t-n{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); font-weight:600;
  min-width:15px; text-align:right}
.t-ico{cursor:pointer; color:var(--ink-2); display:inline-flex; padding:2px}
.t-ico:hover{color:var(--accent)}
.task input,.task select,.task button{font-family:inherit}
.t-row input,.t-row select{font-size:12.5px; padding:3px 6px; border:1px solid var(--line);
  border-radius:5px; background:var(--card); color:var(--ink)}
.t-row input:focus,.t-row select:focus{outline:none; border-color:var(--accent)}
.t-name{flex:1 1 120px; min-width:84px; font-weight:600}
.t-kind{flex:0 0 auto; font-size:12px !important; padding:3px 4px !important}
.t-fields{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-3)}
.t-t{width:92px; font-family:"IBM Plex Mono",monospace; font-size:11px !important;
  padding:3px 2px !important}
.t-num{width:46px; text-align:right; font-family:"IBM Plex Mono",monospace}
.t-num.sm{width:38px}
.t-fields i{font-style:normal; font-size:10.5px; color:var(--ink-3); white-space:nowrap}
.t-place{flex:0 1 112px; min-width:78px}
.t-when{flex:0 0 auto; margin-left:auto; padding-left:4px;
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-2);
  white-space:nowrap; text-align:right}
/* A task that ends where it started is a task spent standing still, and that is
   the one thing on this screen worth spotting from across the room. */
.t-when.still{color:var(--accent)}
.t-mv.has{border-color:var(--ink-3); color:var(--ink-2)}
.t-x,.t-mv{background:none; border:1px solid var(--line); color:var(--ink-3); font-size:11px;
  width:22px; height:22px; border-radius:5px; cursor:pointer; padding:0; line-height:1; flex:0 0 auto}
.t-x:hover{border-color:var(--bad); color:var(--bad)}
.t-mv:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.t-mv:disabled{opacity:.35; cursor:default}
.dcell{display:inline-flex; gap:1px}
.d{width:17px; height:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-3);
  font-size:9.5px; font-weight:600; border-radius:3px; cursor:pointer; padding:0}
.d.on{background:var(--good); border-color:var(--good); color:#fff}
.d:hover{border-color:var(--accent)}
/* Prereqs are stored; what a task feeds is the same edges read backwards, so it
   is derived and shown rather than typed. Both live in the one popover so the
   row stays a row. */
.t-afterwrap{position:relative; flex:0 0 auto}
.t-after{background:var(--card-2); border:1px solid var(--line); color:var(--ink-3); font-size:11px;
  padding:3px 8px; border-radius:11px; cursor:pointer; max-width:116px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.t-after.on{color:var(--ink-2); border-color:var(--ink-3)}
.t-after:hover{border-color:var(--accent); color:var(--accent)}
.t-pop{position:absolute; z-index:20; top:26px; right:0; width:270px; padding:9px;
  background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  display:flex; flex-wrap:wrap; gap:4px}
.t-pop[hidden]{display:none}
.chip{border:1px solid var(--line); background:var(--card); color:var(--ink-3);
  font-size:11px; padding:2px 8px; border-radius:11px; cursor:pointer; white-space:nowrap}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--card); font-weight:600}
.chip:hover:not(.on){border-color:var(--accent); color:var(--accent)}
.t-feeds,.feeds{flex:1 1 100%; font-size:11px; color:var(--ink-3); padding-top:3px;
  border-top:1px solid var(--line-2); margin-top:2px}
.t-feeds b{color:var(--ink-2); font-weight:600}
.t-noterow{padding:0 9px 8px 30px}
.t-noterow[hidden]{display:none}
.t-noterow input{width:100%; font-size:12px; padding:3px 7px; border:1px solid var(--line);
  border-radius:5px; background:var(--card-2); color:var(--ink-2)}
.t-noterow input:focus{outline:none; border-color:var(--accent); background:var(--card)}
@media (max-width:1150px){ .t-row{flex-wrap:wrap} .t-when{margin-left:0} }
.warn{margin:0 18px 14px; padding:9px 12px; border:1px solid var(--bad); border-radius:7px;
  background:var(--accent-soft); color:var(--bad); font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Task Vis</h1>
      <p class="sub" id="sub">One flow at a time. Time runs across, place runs down — so a diagonal is movement and a flat run is waiting.</p>
    </div>
  </header>

  <section class="panel">
    <div class="panel-hd">
      <h2>Flow</h2>
      <span class="seg" id="pick"></span>
      <span class="lbl">Day 0</span>
      <span class="seg" id="day"></span>
      <button class="btn" id="reset" style="margin-left:auto">Back to defaults</button>
    </div>
    <div class="body">
      <div class="axis" id="axis"></div>
      <div id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <!-- A flow is a set of tasks and the prereqs between them. Nothing about it
       is written into the code: change a task here and the chart is the answer. -->
  <section class="panel">
    <div class="panel-hd">
      <h2>Tasks</h2>
      <span class="note" id="tnote"></span>
      <button class="btn solid" id="add" style="margin-left:auto">Add a task</button>
    </div>
    <div id="warn"></div>
    <div class="tasks" id="tasks"></div>
  </section>
</div>
<script>
(function () {
  "use strict";

  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var STORE = 'taskvis.flows.v1';

  var ICON = {
    box:   '<path d="M2 5.2 8 2.4l6 2.8v5.6L8 13.6 2 10.8z"/><path d="M2 5.2 8 8l6-2.8M8 8v5.6"/>',
    truck: '<path d="M1 4.5h8.2v6H1z"/><path d="M9.2 6.6h2.6L14.4 9v1.5H9.2z"/><circle cx="4.2" cy="11.6" r="1.5"/><circle cx="11.3" cy="11.6" r="1.5"/>',
    plane: '<path d="M1.6 8.4 14.4 3.6l-3 5.2 1.1 4.4-2.4-1.5-2.2 1.9-.4-3.1z"/>',
    ship:  '<path d="M2.4 9.6h11.2l-1.7 3.8H4.1z"/><path d="M4.3 9.6V5.8h7.4v3.8M8 5.8V3.2"/>',
    depot: '<path d="M1.8 6.8 8 3.4l6.2 3.4v6.4H1.8z"/><path d="M5.6 13.2V9h4.8v4.2"/>',
    store: '<path d="M2 6.4h12v6.8H2z"/><path d="M2 6.4 3.4 3h9.2L14 6.4"/><path d="M6.4 13.2V9.4h3.2v3.8"/>',
    clock: '<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/>'
  };
  var ICONS = ['box', 'truck', 'plane', 'ship', 'depot', 'store', 'clock'];
  function ico(k) {
    return '<svg class="i" viewBox="0 0 16 16" width="14" height="14" fill="none" ' +
      'stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">' +
      (ICON[k] || ICON.clock) + '</svg>';
  }

  // ── What a task is ────────────────────────────────────────────────────────
  // Four kinds, which between them say everything this model knows about when
  // a thing happens:
  //
  //   at      a clock time on day 0. A task with no prereqs needs one of these.
  //   takes   N hours after its prereqs are all done. Loading, driving, flying.
  //   opens   waits until somebody will take it: which days, what hours, and
  //           how long after arrival before it can even be collected.
  //   sails   waits for the next scheduled departure on given weekdays.
  //
  // Each task also names the place the product is in when the task ends, and
  // those places are the chart's vertical axis. A task ending where its prereq
  // ended is a wait; a task ending somewhere else is a move.
  //
  // Dependencies are stored one way only. A task lists what it comes `after`;
  // what it feeds is those same edges read backwards, so it is derived on the
  // fly and the two can never drift apart. A task starts when the LAST of its
  // prereqs is done, which is what makes a merge behave like a merge.
  var KINDS = [
    ['at',    'At a time'],
    ['takes', 'Takes'],
    ['opens', 'Waits for a window'],
    ['sails', 'Waits for a departure']
  ];

  function defaults() {
    return [{
      id: 'kona-lettuce',
      name: 'Lettuce → Costco Kona',
      note: 'Our own box truck. No carrier at all, so the only thing between packing and the customer is who is awake.',
      days: ['Sun', 'Mon', 'Wed', 'Thu'],
      tasks: [
        { id: 'pack',  name: 'Packing ends',     place: 'Packhouse',   icon: 'box',   kind: 'at',
          at: 18, after: [] },
        { id: 'crew',  name: 'Crew on shift',    place: 'Packhouse',   icon: 'depot', kind: 'opens',
          days: [1,1,1,1,1,1,1], open: 6, close: 19, lead: 0, after: ['pack'],
          note: 'Nobody is here to load a truck outside these hours.' },
        { id: 'load',  name: 'Truck loaded',     place: 'Packhouse',   icon: 'truck', kind: 'takes',
          dur: 1, after: ['crew'],
          note: 'A box truck cannot stand loaded overnight, so it is loaded right before it drives.' },
        { id: 'drive', name: 'Drive to Kona',    place: 'Costco Kona', icon: 'truck', kind: 'takes',
          dur: 2, after: ['load'] },
        { id: 'recv',  name: 'Costco receiving', place: 'Costco Kona', icon: 'store', kind: 'opens',
          days: [0,1,1,1,1,1,1], open: 4, close: 11, lead: 0, after: ['drive'],
          note: 'The back door. Shut Sundays.' }
      ]
    }];
  }

  var F = defaults(), S = { id: 'kona-lettuce', day: 'Sun' };
  try {
    var sv = JSON.parse(window.localStorage.getItem(STORE) || 'null');
    if (sv && sv.flows && sv.flows.length) F = sv.flows;
    if (sv && sv.pick) S = sv.pick;
  } catch (e) { /* nothing stored, or junk in the slot */ }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify({ flows: F, pick: S })); } catch (e) {}
  }
  function cur() {
    for (var i = 0; i < F.length; i++) if (F[i].id === S.id) return F[i];
    S.id = F[0].id;
    return F[0];
  }

  // ── Clock ─────────────────────────────────────────────────────────────────
  var SPAN = 3, ANCHOR = 'Sun';
  var dowIdx = function (n) { return DOW.indexOf(n); };
  function clock(h) {
    var t = ((Math.round(h * 2) / 2 % 24) + 24) % 24, hh = Math.floor(t), m = t - hh === .5 ? ':30' : '';
    return (hh % 12 === 0 ? 12 : hh % 12) + m + ' ' + (hh < 12 ? 'AM' : 'PM');
  }
  function stamp(h) { return DOW[(dowIdx(ANCHOR) + Math.floor(h / 24)) % 7] + ' ' + clock(h); }
  function hhmm(h) {
    var t = ((h % 24) + 24) % 24, hr = Math.floor(t), mn = Math.round((t - hr) * 60);
    return (hr < 10 ? '0' : '') + hr + ':' + (mn < 10 ? '0' : '') + mn;
  }
  function fromHM(s) {
    var p = String(s || '').split(':'), h = parseFloat(p[0]), m = parseFloat(p[1] || 0);
    return isNaN(h) ? 0 : Math.max(0, Math.min(23.98, h + (isNaN(m) ? 0 : m / 60)));
  }
  function num(v, d) { var n = parseFloat(v); return isNaN(n) ? (d || 0) : n; }
  function winSpan(t) {
    var a = clock(num(t.open)), b = clock(num(t.close));
    return a.slice(-2) === b.slice(-2) ? a.slice(0, -3) + '–' + b : a + '–' + b;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function all(q) { return [].slice.call(document.querySelectorAll(q)); }
  function uid(p) { return p + '-' + Math.random().toString(36).slice(2, 7); }

  // ── Walking the graph ─────────────────────────────────────────────────────
  function nextOpen(t, h) {
    h += num(t.lead, 0);
    for (var i = 0; i < 28; i++) {
      var d = Math.floor(h / 24) + i, dw = (dowIdx(ANCHOR) + d) % 7;
      if (!t.days || !t.days[dw]) continue;
      var o = d * 24 + num(t.open), c = d * 24 + num(t.close);
      if (h <= o) return o;
      if (h < c) return h;
    }
    return h;
  }
  function nextDeparture(t, h) {
    for (var i = 0; i < 28; i++) {
      var d = Math.floor(h / 24) + i, dw = (dowIdx(ANCHOR) + d) % 7;
      if (!t.days || !t.days[dw]) continue;
      var x = d * 24 + num(t.at);
      if (x >= h) return x;
    }
    return h;
  }
  function endOf(t, base) {
    if (t.kind === 'at') return num(t.at);
    if (t.kind === 'takes') return base + num(t.dur);
    if (t.kind === 'opens') return nextOpen(t, base);
    if (t.kind === 'sails') return nextDeparture(t, base);
    return base;
  }
  // A task runs when the LAST of its prereqs is done, so a merge waits for
  // everything feeding it. Anything still unresolved after no further progress
  // is in a cycle or points at a task that is gone; it is reported, not hidden.
  function walk(flow) {
    var byId = {}, at = {}, span = {}, order = [];
    flow.tasks.forEach(function (t) { byId[t.id] = t; });
    var pending = flow.tasks.slice(), guard = 0;
    while (pending.length && guard++ < 999) {
      var moved = false;
      for (var i = 0; i < pending.length; i++) {
        var t = pending[i];
        var pre = (t.after || []).filter(function (id) { return byId[id]; });
        var ready = pre.every(function (id) { return at[id] !== undefined; });
        if (!ready) continue;
        // A task starts when the LAST of its prereqs is done and stops when its
        // own kind says so. Both are real times, and the gap between them is
        // the task: an hour of loading, or eleven hours outside a shut door.
        var base = pre.length ? Math.max.apply(null, pre.map(function (id) { return at[id]; })) : 0;
        var e = endOf(t, base);
        var s = t.kind === 'at' ? e : base;
        // Where it starts is where the prereq that governed it left off; with
        // nothing behind it, it starts where it ends.
        var gov = null;
        pre.forEach(function (id) { if (at[id] === base && gov === null) gov = id; });
        span[t.id] = { s: s, e: e, from: gov ? (byId[gov].place || 'Somewhere') : (t.place || 'Somewhere') };
        at[t.id] = e;
        order.push(t.id);
        pending.splice(i, 1); i--; moved = true;
      }
      if (!moved) break;
    }
    var pts = order.map(function (id) {
      var t = byId[id], sp = span[id];
      return { id: id, t: t, h: sp.e, s: sp.s, e: sp.e, from: sp.from, place: t.place || 'Somewhere' };
    });
    var starts = pts.map(function (p) { return p.s; }), ends = pts.map(function (p) { return p.e; });
    var start = starts.length ? Math.min.apply(null, starts) : 0;
    var end = ends.length ? Math.max.apply(null, ends) : 0;
    // A task that ends where it started is a task spent standing still.
    var idle = pts.reduce(function (a, p) {
      return p.from === p.place ? a + Math.max(0, p.e - p.s) : a;
    }, 0);
    // Links back to every prereq. The governing one is a point; an earlier one
    // leaves a gap, which is that branch finishing early and waiting.
    var edges = [];
    flow.tasks.forEach(function (t) {
      if (!span[t.id]) return;
      (t.after || []).forEach(function (id) {
        if (at[id] === undefined) return;
        edges.push({ from: id, to: t.id, h0: at[id], h1: span[t.id].s,
                     p0: byId[id].place || 'Somewhere' });
      });
    });
    return {
      at: at, span: span, byId: byId, pts: pts, edges: edges,
      stuck: pending.map(function (t) { return t.id; }),
      start: start, end: end,
      days: Math.floor(end / 24) - Math.floor(start / 24),
      hrs: Math.round(end - start), idle: Math.round(idle)
    };
  }
  // Places, in the order the walk first reaches them, so the vertical axis
  // reads top to bottom the way the product actually travels.
  function places(r) {
    var seen = {}, out = [];
    r.pts.forEach(function (p) { if (!seen[p.place]) { seen[p.place] = 1; out.push(p.place); } });
    return out;
  }
  function feedsOf(flow, id) {
    return flow.tasks.filter(function (t) { return (t.after || []).indexOf(id) >= 0; });
  }
  function gateAt(flow, place) {
    for (var i = 0; i < flow.tasks.length; i++) {
      var t = flow.tasks[i];
      if (t.kind === 'opens' && (t.place || 'Somewhere') === place) return t;
    }
    return null;
  }

  // ── Drawing ───────────────────────────────────────────────────────────────
  var LANE_H = 38, PAD_T = 14, PAD_B = 18, PLOT_PX = 1060;
  var X = function (h) { return (h / (SPAN * 24)) * 1000; };
  var PCT = function (h) { return (h / (SPAN * 24)) * 100; };

  function chart(flow, r) {
    var lanes = places(r), yOf = {};
    lanes.forEach(function (l, i) { yOf[l] = PAD_T + i * LANE_H + LANE_H / 2; });
    var H = PAD_T + lanes.length * LANE_H + PAD_B;

    var svg = '';
    for (var c = 1; c < SPAN; c++) {
      svg += '<line class="col" x1="' + X(c * 24) + '" x2="' + X(c * 24) + '" y1="0" y2="' + H + '"/>';
    }

    var busy = {}, caps = '';
    r.pts.forEach(function (p) { (busy[p.place] || (busy[p.place] = [])).push(PCT(p.h)); });
    lanes.forEach(function (l, i) {
      var y = PAD_T + i * LANE_H;
      svg += '<line class="lane" x1="0" x2="1000" y1="' + (y + LANE_H / 2) + '" y2="' + (y + LANE_H / 2) + '"/>';
      var g = gateAt(flow, l);
      if (!g) return;
      var open = [];
      for (var d = 0; d < SPAN; d++) {
        if (!g.days[(dowIdx(ANCHOR) + d) % 7]) continue;
        open.push(d);
        var x0 = X(d * 24 + num(g.open)), x1 = X(d * 24 + num(g.close));
        svg += '<rect class="band" x="' + x0 + '" width="' + Math.max(0, x1 - x0) +
          '" y="' + (y + 5) + '" height="' + (LANE_H - 10) + '" data-task="' + esc(g.id) +
          '"><title>' + esc(g.name) + ' — ' + winSpan(g) + '. Click to open the task.</title></rect>';
      }
      if (!open.length) return;
      var mine = busy[l] || [], pick = open[0];
      for (var oi = 0; oi < open.length; oi++) {
        var px = PCT(open[oi] * 24 + num(g.open)), clear = true;
        for (var bi = 0; bi < mine.length; bi++) if (Math.abs(mine[bi] - px) < 15) clear = false;
        if (clear) { pick = open[oi]; break; }
      }
      caps += '<div class="cap" style="left:' + PCT(pick * 24 + num(g.open)) + '%;top:' + (y + 3) + 'px">' +
        esc(g.name) + '</div>';
    });

    // A dependency that finished early leaves a gap before the task it feeds
    // starts. That gap is that branch standing about, so it is drawn where it
    // stood — on the prereq's own lane.
    var move = '', wait = '', grabs = '', link = '';
    r.edges.forEach(function (e) {
      if (e.h1 - e.h0 <= .01) return;
      link += '<line class="link" x1="' + X(e.h0) + '" y1="' + yOf[e.p0] +
        '" x2="' + X(e.h1) + '" y2="' + yOf[e.p0] + '"/>';
    });
    // Then every task as a bar, from where and when it started to where and
    // when it stopped. Flat is standing still; sloped is moving.
    r.pts.forEach(function (p) {
      if (p.e - p.s <= .01 && p.from === p.place) return;   // an instant, no bar
      var seg = 'x1="' + X(p.s) + '" y1="' + yOf[p.from] + '" x2="' + X(p.e) + '" y2="' + yOf[p.place] + '"';
      var still = p.from === p.place;
      if (still) wait += '<line class="wait" ' + seg + '/>';
      else move += '<line class="move" ' + seg + '/>';
      svg += '<circle class="tick" cx="' + X(p.s) + '" cy="' + yOf[p.from] + '" r="2.6"/>';
      grabs += '<line class="grab ' + (p.t.kind === 'takes' ? 'leg' : 'gate') + '" ' + seg +
        ' data-task="' + esc(p.id) + '"><title>' + esc(p.t.name) + ' — ' + stamp(p.s) + ' to ' +
        stamp(p.e) + ', ' + Math.round(p.e - p.s) + ' h' +
        (p.t.kind === 'takes' ? '. Drag the bar to change it.' : still ? ' standing still.' : '.') +
        '</title></line>';
    });
    svg += link + wait + move + grabs;

    var dots = '', placed = {};
    r.pts.forEach(function (p, i) {
      var x = PCT(p.h), last = p.h === r.end;
      var nm = p.t.name || 'Task', tm = clock(p.h);
      var wpc = (30 + (nm.length + tm.length) * 5.3) / PLOT_PX * 100;
      var flip = x + wpc > 99;
      var lo = flip ? x - wpc : x, hi = flip ? x : x + wpc;
      var lane = placed[p.place] || (placed[p.place] = []), slot = 0;
      for (; slot < 3; slot++) {
        var free = true;
        for (var q = 0; q < lane.length; q++) {
          var o = lane[q];
          if (o.slot === slot && lo < o.hi + .5 && o.lo < hi + .5) { free = false; break; }
        }
        if (free) break;
      }
      lane.push({ lo: lo, hi: hi, slot: slot });
      var fed = feedsOf(flow, p.id);
      dots += '<div class="dot s' + slot + (last ? ' end' : '') + (flip ? ' flip' : '') +
        '" style="left:' + x + '%;top:' + yOf[p.place] + 'px" data-task="' + esc(p.id) + '"' +
        ' title="' + esc(nm) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' +
        Math.round(p.e - p.s) + ' h' + (p.t.note ? '. ' + esc(p.t.note) : '') +
        (fed.length ? '. Feeds ' + esc(fed.map(function (x2) { return x2.name; }).join(', ')) : '') +
        '. Click to open the task.">' +
        '<b></b><span>' + ico(p.t.icon) + esc(nm) + '<em>' + tm + '</em></span></div>';
    });

    var lbl = lanes.map(function (l) {
      var g = gateAt(flow, l);
      return '<div class="lane-lbl" style="height:' + LANE_H + 'px">' + esc(l) +
        (g ? '<i>' + winSpan(g) + '</i>' : '') + '</div>';
    }).join('');

    return '<div class="hd"><b>' + esc(flow.name) + '</b><small>' + esc(flow.note || '') + '</small>' +
      '<div class="res"><b>' + r.days + '</b><small>' + (r.days === 1 ? 'day' : 'days') + '</small>' +
      '<em>' + r.hrs + ' h, ' + r.idle + ' waiting</em></div></div>' +
      '<div class="chart"><div class="gut" style="padding-top:' + PAD_T + 'px">' + lbl + '</div>' +
      '<div class="plot" style="height:' + H + 'px">' +
      '<svg class="svg" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none">' + svg + '</svg>' +
      caps + dots + '</div></div>';
  }

  // ── The builder ───────────────────────────────────────────────────────────
  function card(t, i, flow, r) {
    var sp = r.span[t.id];
    var still = sp && sp.from === (t.place || 'Somewhere') && sp.e - sp.s > .01;
    var when = !sp ? '—'
      : sp.e - sp.s <= .01 ? stamp(sp.e)
      : stamp(sp.s) + ' → ' + stamp(sp.e) + ' · ' + Math.round(sp.e - sp.s) + ' h';

    // The definition of a task is one line. Every control carries its own
    // meaning -- a time input looks like a time, seven letters look like days --
    // so the labels that used to caption them were costing a whole row to say
    // what the control already said.
    var f = '';
    if (t.kind === 'at') {
      f = '<input class="t-t" type="time" step="900" value="' + hhmm(num(t.at)) +
          '" data-f="at" title="Clock time on day 0">';
    } else if (t.kind === 'takes') {
      f = '<input class="t-num" type="number" min="0" max="240" step="0.5" value="' + num(t.dur) +
          '" data-f="dur" title="How many hours it takes"><i>h</i>';
    } else if (t.kind === 'opens') {
      f = dayBtns(t) +
          '<input class="t-t" type="time" step="900" value="' + hhmm(num(t.open)) +
          '" data-f="open" title="Opens"> – ' +
          '<input class="t-t" type="time" step="900" value="' + hhmm(num(t.close)) +
          '" data-f="close" title="Closes">' +
          '<input class="t-num sm" type="number" min="0" max="240" step="1" value="' + num(t.lead) +
          '" data-f="lead" title="Hours after arrival before it can be collected"><i>h after</i>';
    } else {
      f = dayBtns(t) +
          '<input class="t-t" type="time" step="900" value="' + hhmm(num(t.at)) +
          '" data-f="at" title="Departure time">';
    }

    var pre = (t.after || []).filter(function (id) { return r.byId[id]; });
    var afterLbl = !pre.length ? 'after —'
      : pre.length === 1 ? 'after ' + (r.byId[pre[0]].name || '?')
      : 'after ' + pre.length;
    var others = flow.tasks.filter(function (o) { return o.id !== t.id; });
    var pop = '<div class="t-pop" hidden>' + (others.length
      ? others.map(function (o) {
          return '<button class="chip' + ((t.after || []).indexOf(o.id) >= 0 ? ' on' : '') +
            '" data-after="' + esc(o.id) + '">' + esc(o.name) + '</button>';
        }).join('')
      : '<span class="feeds">nothing else to depend on yet</span>') +
      '<div class="t-feeds">' + feedsLine(flow, t, r) + '</div></div>';

    var orphan = r.at[t.id] === undefined || (r.loose && r.loose[t.id]);
    return '<div class="task' + (orphan ? ' orphan' : '') + '" id="task-' + esc(t.id) + '">' +
      '<div class="t-row">' +
      '<span class="t-n">' + (i + 1) + '</span>' +
      '<span class="t-ico" data-ico="1" title="Change the icon">' + ico(t.icon) + '</span>' +
      '<input class="t-name" value="' + esc(t.name) + '" data-f="name" placeholder="Name this task"' +
      (t.note ? ' title="' + esc(t.note) + '"' : '') + '>' +
      '<select class="t-kind" data-f="kind">' + KINDS.map(function (k) {
        return '<option value="' + k[0] + '"' + (t.kind === k[0] ? ' selected' : '') + '>' + k[1] + '</option>';
      }).join('') + '</select>' +
      '<span class="t-fields">' + f + '</span>' +
      '<input class="t-place" value="' + esc(t.place) + '" data-f="place" list="places" ' +
      'placeholder="Where it ends up" title="Where the product is when this task stops">' +
      '<span class="t-afterwrap"><button class="t-after' + (pre.length ? ' on' : '') +
      '" title="What has to finish first">' + esc(afterLbl) + '</button>' + pop + '</span>' +
      '<span class="t-when' + (still ? ' still' : '') + '">' + when + '</span>' +
      '<button class="t-mv' + (t.note ? ' has' : '') + '" data-note="1" title="' +
      (t.note ? esc(t.note) : 'Add a note') + '">&#9432;</button>' +
      '<button class="t-mv" data-mv="-1" title="Move up"' + (i ? '' : ' disabled') + '>&#8593;</button>' +
      '<button class="t-mv" data-mv="1" title="Move down"' +
        (i === flow.tasks.length - 1 ? ' disabled' : '') + '>&#8595;</button>' +
      '<button class="t-x" data-del="1" title="Remove this task">&times;</button>' +
      '</div>' +
      '<div class="t-noterow" hidden>' +
      '<input value="' + esc(t.note || '') + '" data-f="note" placeholder="Why this task is here"></div>' +
      '</div>';
  }
  function feedsLine(flow, t, r) {
    var fed = feedsOf(flow, t.id);
    return fed.length
      ? 'Feeds <b>' + fed.map(function (o) { return esc(o.name); }).join('</b>, <b>') + '</b>'
      : (r.at[t.id] === r.end ? 'Feeds nothing — this is the end of the flow' : 'Feeds nothing yet');
  }
  function dayBtns(t) {
    return '<span class="dcell">' + DOW.map(function (dn, d) {
      return '<button class="d' + (t.days && t.days[d] ? ' on' : '') + '" data-day="' + d +
        '" title="' + dn + '">' + dn[0] + '</button>';
    }).join('') + '</span>';
  }
  function blank(kind, after) {
    var t = { id: uid('t'), name: 'New task', place: '', icon: 'clock', kind: kind || 'takes',
              dur: 1, after: after || [] };
    if (kind === 'opens') { t.days = [1,1,1,1,1,1,1]; t.open = 8; t.close = 17; t.lead = 0; }
    if (kind === 'sails') { t.days = [0,0,1,0,0,1,0]; t.at = 18; }
    if (kind === 'at') t.at = 18;
    return t;
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function paint(chartOnly) {
    var flow = cur();
    if (flow.days.indexOf(S.day) < 0) S.day = flow.days[0];
    ANCHOR = S.day;

    var r = walk(flow);
    SPAN = Math.max(2, Math.ceil(r.end / 24) + 1);
    r = walk(flow);

    var ax = '';
    for (var i = 0; i < SPAN; i++) {
      ax += '<div class="day' + (i === 0 ? ' cut' : '') + '">' + DOW[(dowIdx(ANCHOR) + i) % 7] + '</div>';
    }
    document.getElementById('axis').innerHTML = '<div class="gut"></div><div class="days">' + ax + '</div>';
    document.getElementById('grid').innerHTML = chart(flow, r);
    document.getElementById('legend').innerHTML =
      '<span><i class="sw band"></i>a green box is one day of a window this flow waits for</span>' +
      '<span><i class="sw mv"></i>moving</span>' +
      '<span><i class="sw wt"></i>waiting</span>' +
      '<span><i class="sw tk"></i>where the task starts</span>' +
      '<span class="note">Drag a solid bar to change how long that leg takes. ' +
      'Click any dot, band or flat run to open its task.</span>';
    // Two ways a flow can be wrong, and both are worth saying out loud.
    var loose = flow.tasks.filter(function (t) {
      return t.kind !== 'at' && !(t.after || []).filter(function (id) { return r.byId[id]; }).length;
    });
    var warn = '';
    if (r.stuck.length) {
      warn += '<div class="warn">' + r.stuck.length + ' task' + (r.stuck.length > 1 ? 's are' : ' is') +
        ' unreachable: ' + r.stuck.map(function (id) {
          return esc((r.byId[id] || {}).name || id);
        }).join(', ') + '. Either they depend on each other in a circle, or on a task that ' +
        'has been deleted. They are outlined in red below and left off the chart.</div>';
    }
    if (loose.length) {
      warn += '<div class="warn">' + loose.map(function (t) { return esc(t.name); }).join(', ') +
        ' ' + (loose.length > 1 ? 'have' : 'has') + ' nothing to come after, so ' +
        (loose.length > 1 ? 'they are' : 'it is') + ' being counted from midnight on day 0. ' +
        'Give ' + (loose.length > 1 ? 'them' : 'it') + ' a prereq, or make ' +
        (loose.length > 1 ? 'them' : 'it') + ' an “At a time” task.</div>';
    }
    document.getElementById('warn').innerHTML = warn;
    var looseIds = {};
    loose.forEach(function (t) { looseIds[t.id] = 1; });
    r.loose = looseIds;
    document.getElementById('tnote').textContent =
      flow.tasks.length + ' tasks · ' + places(r).length + ' places · ' + r.edges.length +
      ' links · ' + r.hrs + ' h, of which ' + r.idle + ' standing still';

    if (!chartOnly) {
      seg('pick', F.map(function (x) { return [x.id, x.name]; }), S.id,
        function (v) { S.id = v; save(); paint(); });
      seg('day', flow.days.map(function (d) { return [d, d]; }), S.day,
        function (v) { S.day = v; save(); paint(); });
      document.getElementById('tasks').innerHTML =
        '<datalist id="places">' + places(r).map(function (p) {
          return '<option value="' + esc(p) + '">';
        }).join('') + '</datalist>' +
        flow.tasks.map(function (t, i) { return card(t, i, flow, r); }).join('');
    } else {
      // A keystroke must not retype the form under the cursor, so only the
      // times each card reports are refreshed.
      flow.tasks.forEach(function (t) {
        var el = document.querySelector('#task-' + cssId(t.id) + ' .t-when'), sp = r.span[t.id];
        if (!el) return;
        el.textContent = !sp ? '—'
          : sp.e - sp.s <= .01 ? stamp(sp.e)
          : stamp(sp.s) + ' → ' + stamp(sp.e) + ' · ' + Math.round(sp.e - sp.s) + ' h';
        el.classList.toggle('still', !!sp && sp.from === (t.place || 'Somewhere') && sp.e - sp.s > .01);
      });
    }
    wire(flow, r);
  }
  function cssId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, '\\$&'); }

  function wire(flow, r) {
    all('#tasks .task').forEach(function (cardEl) {
      var id = cardEl.id.replace(/^task-/, '');
      var t = null;
      flow.tasks.forEach(function (x, i) { if (x.id === id) { t = x; t.__i = i; } });
      if (!t) return;
      [].slice.call(cardEl.querySelectorAll('[data-f]')).forEach(function (el) {
        el.oninput = function () {
          var f = el.getAttribute('data-f');
          if (f === 'kind') {
            var fresh = blank(el.value, t.after);
            fresh.id = t.id; fresh.name = t.name; fresh.place = t.place;
            fresh.icon = t.icon; fresh.note = t.note;
            flow.tasks[t.__i] = fresh;
            save(); paint();
            return;
          }
          if (f === 'name' || f === 'place' || f === 'note') t[f] = el.value;
          else if (el.type === 'time') t[f] = fromHM(el.value);
          else t[f] = Math.max(0, num(el.value));
          save(); paint(true);
        };
      });
      [].slice.call(cardEl.querySelectorAll('.d')).forEach(function (b) {
        b.onclick = function () {
          var d = +b.getAttribute('data-day');
          t.days[d] = t.days[d] ? 0 : 1;
          b.classList.toggle('on');
          save(); paint(true);
        };
      });
      [].slice.call(cardEl.querySelectorAll('.chip')).forEach(function (b) {
        b.onclick = function (ev) {
          ev.stopPropagation();
          var dep = b.getAttribute('data-after');
          t.after = t.after || [];
          var k = t.after.indexOf(dep);
          if (k >= 0) t.after.splice(k, 1); else t.after.push(dep);
          save(); paint();
          // Setting several prereqs in a row should not mean reopening the
          // popover between each one.
          var again = document.querySelector('#task-' + cssId(t.id) + ' .t-pop');
          if (again) again.hidden = false;
        };
      });
      // The prereq popover, and the note line that is folded away until wanted.
      var ab = cardEl.querySelector('.t-after'), pop = cardEl.querySelector('.t-pop');
      if (ab) ab.onclick = function (ev) {
        ev.stopPropagation();
        var wasOpen = !pop.hidden;
        all('.t-pop').forEach(function (o) { o.hidden = true; });
        pop.hidden = wasOpen;
      };
      if (pop) pop.onclick = function (ev) { ev.stopPropagation(); };
      var nb = cardEl.querySelector('[data-note]');
      if (nb) nb.onclick = function () {
        var row = cardEl.querySelector('.t-noterow');
        row.hidden = !row.hidden;
        if (!row.hidden) row.querySelector('input').focus();
      };
      var ic = cardEl.querySelector('.t-ico');
      if (ic) ic.onclick = function () {
        t.icon = ICONS[(ICONS.indexOf(t.icon) + 1) % ICONS.length];
        save(); paint();
      };
      [].slice.call(cardEl.querySelectorAll('.t-mv')).forEach(function (b) {
        b.onclick = function () {
          var i = t.__i, d = +b.getAttribute('data-mv');
          if (i + d < 0 || i + d >= flow.tasks.length) return;
          var x = flow.tasks[i]; flow.tasks[i] = flow.tasks[i + d]; flow.tasks[i + d] = x;
          save(); paint();
        };
      });
      var del = cardEl.querySelector('.t-x');
      if (del) del.onclick = function () {
        if (flow.tasks.length <= 1) return;
        flow.tasks.splice(t.__i, 1);
        // Delete a task out of the middle and the chain has to close over the
        // hole: whatever depended on it inherits what IT depended on. Merely
        // dropping the dead id leaves the next task with no prereq at all, and
        // a task with no prereq starts at midnight on day 0 -- so removing one
        // step silently moved everything after it to the wrong day.
        var inherited = (t.after || []).slice();
        flow.tasks.forEach(function (o) {
          if ((o.after || []).indexOf(t.id) < 0) return;
          o.after = o.after.filter(function (x) { return x !== t.id; });
          inherited.forEach(function (x) {
            if (x !== o.id && o.after.indexOf(x) < 0) o.after.push(x);
          });
        });
        save(); paint();
      };
    });

    all('#grid [data-task]').forEach(function (el) {
      if (el.classList.contains('leg')) return;
      el.addEventListener('click', function () {
        var c = document.getElementById('task-' + el.getAttribute('data-task'));
        if (!c) return;
        c.classList.add('lit');
        c.scrollIntoView({ block: 'center' });
        window.setTimeout(function () { c.classList.remove('lit'); }, 2600);
      });
    });
    all('#grid .grab.leg').forEach(function (el) {
      el.addEventListener('mousedown', function (ev) {
        var t = r.byId[el.getAttribute('data-task')];
        if (!t || t.kind !== 'takes') return;
        var W = el.ownerSVGElement.getBoundingClientRect().width, x0 = ev.clientX, v0 = num(t.dur);
        ev.preventDefault();
        function mv(e) {
          var v = Math.round((v0 + ((e.clientX - x0) / W) * SPAN * 24) * 2) / 2;
          v = Math.max(0, Math.min(240, v));
          if (v === num(t.dur)) return;
          t.dur = v;
          paint(true);
        }
        function up() {
          window.removeEventListener('mousemove', mv);
          window.removeEventListener('mouseup', up);
          save(); paint();
        }
        window.addEventListener('mousemove', mv);
        window.addEventListener('mouseup', up);
      });
    });
  }

  function seg(id, opts, sel, cb) {
    var el = document.getElementById(id);
    el.innerHTML = opts.map(function (o) {
      return '<a data-v="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' class="on"' : '') +
        '>' + esc(o[1]) + '</a>';
    }).join('');
    [].slice.call(el.querySelectorAll('a')).forEach(function (a) {
      a.onclick = function () { cb(a.getAttribute('data-v')); };
    });
  }

  document.addEventListener('click', function () {
    all('.t-pop').forEach(function (o) { o.hidden = true; });
  });

  document.getElementById('add').onclick = function () {
    var flow = cur(), last = flow.tasks[flow.tasks.length - 1];
    var t = blank('takes', last ? [last.id] : []);
    t.place = last ? last.place : '';
    flow.tasks.push(t);
    save(); paint();
    var c = document.getElementById('task-' + t.id);
    if (c) { c.scrollIntoView({ block: 'center' }); c.querySelector('.t-name').select(); }
  };
  document.getElementById('reset').onclick = function () {
    F = defaults(); S = { id: 'kona-lettuce', day: 'Sun' }; save(); paint();
  };

  paint();
})();
</script>
