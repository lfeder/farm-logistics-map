<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Vis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: only light;
  --ground:#eef1f3; --card:#ffffff; --card-2:#f6f8f9;
  --ink:#141b1f; --ink-2:#4a5860; --ink-3:#78878f;
  --line:#d8dfe3; --line-2:#e8edef;
  --accent:#d4541f; --accent-soft:#fbeee7;
  --good:#1d7a52; --bad:#b3341c;
  --band:#e8f2ec; --band-2:#cfe3d8;
  --shadow:0 1px 2px rgba(20,27,31,.06), 0 8px 24px -12px rgba(20,27,31,.18);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:32px 24px 80px; display:flex; flex-direction:column; gap:24px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 28px;
  border-bottom:2px solid var(--ink); padding-bottom:16px}
h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.02em}
.sub{color:var(--ink-2); font-size:14px; margin:2px 0 0}
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
.panel-hd{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:13px 18px;
  border-bottom:1px solid var(--line-2)}
.panel-hd h2{margin:0; font-size:12px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600}
.lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.note{font-size:11.5px; color:var(--ink-3)}
.btn{background:none; border:1px solid var(--line); color:var(--ink-2); font:inherit; font-size:12px;
  padding:4px 12px; border-radius:6px; cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.solid{background:var(--ink); border-color:var(--ink); color:var(--card); font-weight:600}
.btn.solid:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg a{padding:5px 12px; font-size:12.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
  border-left:1px solid var(--line)}
.seg a:first-child{border-left:none}
.seg a.on{background:var(--accent); color:#fff; font-weight:600}
.seg a:hover:not(.on){background:var(--card-2)}

/* ---------- the chart: time across, place down ---------- */
.body{padding:14px 18px 14px}
.axis{display:flex; gap:12px; padding-bottom:2px}
.gut{flex:0 0 128px; display:flex; flex-direction:column}
.days{flex:1 1 auto; min-width:0; display:flex}
.day{flex:1 1 0; text-align:center; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; border-left:1px solid var(--line-2); padding-bottom:3px}
.day:first-child{border-left:none}
.day.cut{color:var(--accent)}
.hd{display:flex; align-items:baseline; gap:9px; padding:2px 0 4px}
.hd b{font-size:14.5px; font-weight:600}
.hd small{font-size:10.5px; color:var(--ink-3)}
.res{margin-left:auto; display:flex; align-items:baseline; gap:5px}
.res b{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; line-height:1}
.res small{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.res em{font-style:normal; font-size:10.5px; color:var(--ink-3)}
.chart{display:flex; gap:12px}
.lane-lbl{display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  font-size:10.5px; font-weight:600; color:var(--ink-2); line-height:1.15; text-align:right}
.lane-lbl button{margin-top:2px; padding:1px 5px; border:1px solid var(--band-2); border-radius:4px;
  background:var(--band); color:var(--good); font-family:"IBM Plex Mono",monospace;
  font-size:9px; font-weight:600; white-space:nowrap; cursor:pointer}
.lane-lbl button.off{background:var(--card-2); border-color:var(--line); color:var(--ink-3)}
.lane-lbl button:hover{border-color:var(--accent); color:var(--accent)}
.plot{position:relative; flex:1 1 auto; min-width:0}
.svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.svg line{vector-effect:non-scaling-stroke}
.lane{stroke:var(--line-2); stroke-width:1}
.col{stroke:var(--line-2); stroke-width:1}
.band{fill:var(--band)}
.cap{position:absolute; font-size:8.5px; font-weight:600; color:var(--good);
  white-space:nowrap; padding-left:3px; pointer-events:none; opacity:.85}
.move{stroke:var(--ink); stroke-width:2; stroke-linecap:round}
.wait{stroke:var(--ink); stroke-width:2; stroke-dasharray:2 3; opacity:.6}
/* A prereq's stop and the next start need not meet. Where they do not, the gap
   is drawn for what it is rather than closed up. */
.link{stroke:var(--ink-3); stroke-width:1.5; stroke-dasharray:1 4; opacity:.75}
.link.back{stroke:var(--bad); opacity:.9; stroke-dasharray:3 3}
.tick{fill:var(--card); stroke:var(--ink); stroke-width:1.5}
.grab{stroke:transparent; stroke-width:13; stroke-linecap:round; cursor:ew-resize}
.grab:hover{stroke:var(--accent); opacity:.22}
.dot{position:absolute; width:0; height:0; color:var(--ink); cursor:pointer}
.dot b{position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50%;
  background:currentColor; display:block}
.dot.end b{left:-4.5px; top:-4.5px; width:9px; height:9px; box-shadow:0 0 0 2px var(--card)}
.dot span{position:absolute; left:7px; display:flex; align-items:center; gap:3px; white-space:nowrap;
  font-size:9.5px; font-weight:500; line-height:1.1}
.dot.s0 span{bottom:2px} .dot.s1 span{top:2px} .dot.s2 span{bottom:13px}
.dot.flip span{left:auto; right:7px; flex-direction:row-reverse}
.dot em{font-style:normal; color:var(--ink-3); font-weight:400}
.dot.end span{font-weight:600}
.dot:hover b{box-shadow:0 0 0 3px var(--accent-soft)}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding-top:14px; margin-top:10px;
  border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.sw{display:inline-block; width:11px; height:11px; border-radius:2px}
.sw.band{background:var(--band); border:1px solid var(--band-2)}
.sw.mv{width:16px; height:2px; border-radius:0; background:var(--ink-2)}
.sw.wt{width:16px; height:0; border-radius:0; border-top:2px dashed var(--ink-3)}
.sw.tk{width:7px; height:7px; border-radius:50%; background:var(--card); border:1.5px solid var(--ink)}
.i{display:inline-block; vertical-align:-2px; flex:0 0 auto}

/* ---------- the list ---------- */
/* Every task carries the same fields, so every row is the same grid and the
   columns line up down the page. That is only possible because a task now says
   when it starts and when it stops outright, rather than each kind of task
   needing its own controls. */
.tasks{padding:0 18px 18px}
.grid{display:grid; gap:0 8px; align-items:center;
  grid-template-columns:
    22px 24px minmax(120px,1fr) minmax(88px,150px)
    62px 92px 62px 92px 52px auto 22px 22px 22px 22px;}
.gh{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding:10px 0 6px; border-bottom:1px solid var(--line); white-space:nowrap}
.gh.r{text-align:right}
.row{display:contents}
.row>*{min-width:0}
.cell{padding:4px 0; border-bottom:1px solid var(--line-2); height:100%;
  display:flex; align-items:center; gap:3px}
.row.lit .cell{background:var(--accent-soft)}
.row.bad .cell{background:var(--accent-soft)}
.n{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); font-weight:600;
  justify-content:flex-end; padding-right:3px}
.ico{cursor:pointer; color:var(--ink-2); justify-content:center}
.ico:hover{color:var(--accent)}
.dur{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  justify-content:flex-end; white-space:nowrap}
/* A task that stops where it started is standing still, and that is the one
   thing on this screen worth spotting from across the room. */
.dur.still{color:var(--accent); font-weight:600}
.dur.bad{color:var(--bad); font-weight:600}
.noterow input:focus{outline:none; border-color:var(--accent); background:var(--card)}
.warn{margin:12px 18px 0; padding:9px 12px; border:1px solid var(--bad); border-radius:7px;
  background:var(--accent-soft); color:var(--bad); font-size:12.5px}

/* ---------- opening hours, which belong to a place ---------- */
/* A window is a fact about a door, not about a task: Costco receiving is open
   4 to 11 whether or not anything is driving towards it. */
.dcell{display:inline-flex; gap:1px}
.d{width:17px; height:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-3);
  font-family:inherit; font-size:9.5px; font-weight:600; border-radius:3px; cursor:pointer; padding:0}
.d.on{background:var(--good); border-color:var(--good); color:#fff}
.d:hover{border-color:var(--accent)}
@media (max-width:1150px){ .tasks{overflow-x:auto} .grid{min-width:1120px} }

/* ---------- tabs ---------- */
.tabs{margin-left:auto}
.page{display:flex; flex-direction:column; gap:24px}
.page[hidden]{display:none}
code{font-family:"IBM Plex Mono",monospace; font-size:.92em; background:var(--card-2);
  border:1px solid var(--line-2); border-radius:4px; padding:0 4px}

/* ---------- the task list, now a reading rather than a form ---------- */
.grid{display:grid; gap:0 10px; align-items:center;
  grid-template-columns:22px 24px minmax(130px,1.2fr) minmax(90px,.8fr)
    118px 118px 62px minmax(90px,.9fr) minmax(0,1.6fr);}
.cell{padding:6px 0; border-bottom:1px solid var(--line-2); height:100%;
  display:flex; align-items:center; min-width:0}
.cell.nm{font-weight:600; font-size:13px}
.cell.plc{font-size:12.5px; color:var(--ink-2)}
.cell.tm{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2)}
.cell.tm.out{color:var(--bad); font-weight:600}
.cell.aft{font-size:11.5px; color:var(--ink-3)}
.cell.nt{font-size:11.5px; color:var(--ink-3); line-height:1.35; padding-right:2px}
.cell.nt em{font-style:normal; color:var(--ink-3)}
.row.lit .cell{background:var(--accent-soft)}
.row.bad .cell{background:var(--accent-soft)}
.tasks{padding:0 18px 18px}

/* ---------- orders and hours ---------- */
.otbl{width:100%; border-collapse:collapse}
.otbl th,.otbl td{text-align:right; padding:5px 10px 5px 0; white-space:nowrap; border:none}
.otbl thead th{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding-bottom:6px; border-bottom:2px solid var(--ink)}
.otbl tbody th{text-align:left; font-size:12px; font-weight:600; color:var(--ink-2)}
.otbl th.wk{vertical-align:middle; font-family:"IBM Plex Mono",monospace; font-size:11px}
.otbl th.hf{font-weight:500; color:var(--ink-3); font-size:11.5px}
.otbl tr.wkstart th,.otbl tr.wkstart td{border-top:1px solid var(--line-2)}
.otbl tr.grp th{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  border-top:2px solid var(--ink); padding-top:10px; text-align:left}
.otbl td b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:14px; font-weight:600; color:var(--ink)}
.otbl td s{text-decoration:none; margin-left:4px; font-family:"IBM Plex Mono",monospace;
  font-size:10px; color:var(--ink-3)}
.otbl td u{text-decoration:none; color:var(--ink-3); font-size:14px}
.otbl.hrs td.dcell,.otbl.hrs td.mono,.otbl.hrs td.nt{text-align:left}
.otbl.hrs .mono{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2)}
.otbl.hrs .d{display:inline-block; width:17px; height:20px; line-height:19px; text-align:center;
  border:1px solid var(--line); border-radius:3px; background:var(--card); color:var(--ink-3);
  font-size:9.5px; font-weight:600; margin-right:1px}
.otbl.hrs .d.on{background:var(--good); border-color:var(--good); color:#fff}
.body h4{margin:18px 0 8px; font-size:11px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600}
.body h4:first-child{margin-top:0}
.hint{margin:14px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.5}
.hint b{color:var(--ink-2); font-weight:600}

/* The unit belongs to the column. Saying "cs" and "lb" against every figure was
   repeating in ninety places what the header can say twice, and it made the
   numbers fight for the eye with their own labels. */
.otbl.orders .grp2{text-align:center; border-bottom:none; padding-bottom:2px}
.otbl.orders tr.units th{font-size:9.5px; letter-spacing:.06em; text-transform:none;
  color:var(--ink-3); font-weight:500; text-align:right; padding-bottom:6px;
  border-bottom:2px solid var(--ink)}
.otbl.orders thead tr:first-child th{border-bottom:none}
.otbl td.fig{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:11.5px; color:var(--ink); text-align:right; padding-right:10px}
.otbl td.fig:nth-of-type(even){padding-right:22px}
.otbl.hrs tr.unk td,.otbl.hrs tr.unk th{opacity:.6}
.otbl.hrs td.mono u{text-decoration:none; color:var(--ink-3)}
.unconfirmed{color:var(--bad); font-weight:600}

/* ---------- pack line ---------- */
/* Three case types at three rates, so the minutes are the point and the cases
   are how you get there. Six figures, in the order the columns come. */
.rates{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:0 0 14px;
  border-bottom:1px solid var(--line-2)}
.rate{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
/* A plain text box. The number spinner's arrows are a smaller target than the
   digit they change and nobody nudges a pack rate one step at a time. */
.rate input{width:52px; font-family:"IBM Plex Mono",monospace; font-size:12px; padding:3px 8px;
  border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--ink);
  text-align:right}
.rate input:focus{outline:none; border-color:var(--accent)}
.otbl.orders tr.minrow td,.otbl.orders tr.minrow th{color:var(--accent); font-weight:600;
  border-bottom:1px solid var(--line); padding-bottom:7px}

/* Branches. Two threads leaving the same morning -- the pallet and the clock
   running beside it -- and the whole point is that they are separate until they
   meet, so they do not share a colour. */
.move.b0,.wait.b0{stroke:var(--ink)}
.move.b1,.wait.b1{stroke:var(--accent)}
.move.b2,.wait.b2{stroke:var(--good)}
.move.b3,.wait.b3{stroke:var(--ink-3)}
.tick.b0{stroke:var(--ink)} .tick.b1{stroke:var(--accent)}
.tick.b2{stroke:var(--good)} .tick.b3{stroke:var(--ink-3)}
.dot.b0{color:var(--ink)} .dot.b1{color:var(--accent)}
.dot.b2{color:var(--good)} .dot.b3{color:var(--ink-3)}
.sw.b0{background:var(--ink)} .sw.b1{background:var(--accent)}

/* ---------- the two pack days ---------- */
/* Hours across, in the order they are packed. The dashed line is the 6.5 h day,
   so a bar running past it is a day that does not fit. */
.packdays{padding:0 0 16px}
.pd{display:flex; align-items:center; gap:12px; padding:5px 0}
.pd-l{flex:0 0 84px; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600}
.pd-bar{position:relative; flex:1 1 auto; min-width:0; height:26px; display:flex;
  background:var(--card-2); border:1px solid var(--line-2); border-radius:5px; overflow:hidden}
.pd-s{display:flex; align-items:center; justify-content:center; overflow:hidden; white-space:nowrap;
  font-size:10px; font-weight:600; color:#fff}
.pd-s.k{background:var(--ink)}
.pd-s.o{background:var(--accent)}
.pd-s.f{background:var(--good)}
.pd-s.r{background:var(--ink-3)}
.pd-cap{position:absolute; top:-2px; bottom:-2px; width:0; border-left:2px dashed var(--bad)}
.pd-h{flex:0 0 76px; text-align:right; font-family:"IBM Plex Mono",monospace; font-size:12px;
  font-weight:600; color:var(--ink)}
.pd-h.over{color:var(--bad)}
.pd-lb{flex:0 0 82px; text-align:right; font-family:"IBM Plex Mono",monospace; font-size:11px;
  color:var(--ink-3)}
.pd-key{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; padding:8px 0 0 96px;
  font-size:11px; color:var(--ink-3)}
.pd-key span{display:inline-flex; align-items:center; gap:5px}
.pd-sw{display:inline-block; width:11px; height:11px; border-radius:2px}
.pd-sw.k{background:var(--ink)} .pd-sw.o{background:var(--accent)}
.pd-sw.f{background:var(--good)} .pd-sw.r{background:var(--ink-3)}
.pd-note{color:var(--bad)}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Task Vis</h1>
      <p class="sub" id="sub">Time runs across, place runs down — so a sloped bar is movement and a flat one is waiting.</p>
    </div>
    <nav class="seg tabs" id="tabs"></nav>
  </header>

  <!-- Flow -->
  <section class="page" id="page-flow">
    <div class="panel">
      <div class="panel-hd">
        <h2>Journey</h2>
        <span class="seg" id="pick"></span>
        <span class="note" id="src" style="margin-left:auto"></span>
      </div>
      <div class="body">
        <div class="axis" id="axis"></div>
        <div id="grid"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><h2>Tasks</h2><span class="note" id="tnote"></span></div>
      <div id="warn"></div>
      <div class="tasks" id="tasks"></div>
    </div>
  </section>

  <!-- Orders -->
  <section class="page" id="page-orders" hidden>
    <div class="panel">
      <div class="panel-hd">
        <h2>Pack line</h2>
        <span class="note" id="onote" style="margin-left:auto"></span>
      </div>
      <div class="body"><div id="orders"></div></div>
    </div>
  </section>

  <!-- Hours -->
  <section class="page" id="page-hours" hidden>
    <div class="panel">
      <div class="panel-hd">
        <h2>Opening hours</h2>
        <span class="note">A window belongs to a place, not to a task — Costco receiving is open 4 to 11 whether or not anything is driving towards it.</span>
      </div>
      <div class="body"><div id="hours"></div></div>
    </div>
  </section>
</div>

    return isNaN(h) ? 0 : Math.max(0, Math.min(23.99, h + (isNaN(m) ? 0 : m / 60)));
  }
  function num(v, d) { var n = parseFloat(v); return isNaN(n) ? (d || 0) : n; }
  function dur(h) {
    var v = Math.round(h * 4) / 4;
    if (v <= 0) return '0 h';
    if (v < 1) return Math.round(v * 60) + ' m';
    return (Math.abs(v - Math.round(v)) < .01 ? Math.round(v) : v.toFixed(2).replace(/0$/, '')) + ' h';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function all(q) { return [].slice.call(document.querySelectorAll(q)); }
  function uid(p) { return p + Math.random().toString(36).slice(2, 7); }
  function cssId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, '\\$&'); }

  // ── Reading a flow ────────────────────────────────────────────────────────
  // There is nothing to solve: the times are already there. This only sorts,
  // works out the places, and finds the links worth drawing.
  function read(flow) {
    var byId = {};
    flow.tasks.forEach(function (t) { byId[t.id] = t; });
    var pts = flow.tasks.map(function (t) {
      return { id: t.id, t: t, s: num(t.s), e: num(t.e), place: t.place || 'Somewhere' };
    });
    var start = 0, end = 0;
    pts.forEach(function (p) {
      start = Math.min(start === 0 && !pts.length ? p.s : start, p.s);
      end = Math.max(end, p.e, p.s);
    });
    if (pts.length) start = Math.min.apply(null, pts.map(function (p) { return p.s; }));
    var idle = pts.reduce(function (a, p) { return a + Math.max(0, p.e - p.s); }, 0);
    var moving = 0, still = 0;
    pts.forEach(function (p) {
      // The leg carries its own origin, so a bar has a real slope rather than
      // one inferred from whatever happened to come before it.
      p.from = p.t.from || p.place;
      if (p.from === p.place) still += Math.max(0, p.e - p.s); else moving += Math.max(0, p.e - p.s);
    });
    var edges = [];
    flow.tasks.forEach(function (t) {
      (t.after || []).forEach(function (id) {
        if (!byId[id]) return;
        edges.push({ from: id, to: t.id, h0: num(byId[id].e), h1: num(t.s),
                     p0: byId[id].place || 'Somewhere' });
      });
    });
    var broken = flow.tasks.filter(function (t) { return num(t.e) < num(t.s); });
    return { byId: byId, pts: pts, edges: edges, broken: broken,
             start: start, end: end, idle: Math.round(idle),
             still: Math.round(still), moving: Math.round(moving),
             days: dayOf(end) - dayOf(start), hrs: Math.round(end - start) };
  }
  // Every location a leg touches, in the order the journey reaches them, so the
  // vertical axis reads top to bottom the way the product travels.
  function places(flow) {
    var seen = {}, out = [];
    flow.tasks.forEach(function (t) {
      [t.from, t.place].forEach(function (p) {
        p = p || 'Somewhere';
        if (!seen[p]) { seen[p] = 1; out.push(p); }
      });
    });
    return out;
  }
  function feedsOf(flow, id) {
    return flow.tasks.filter(function (t) { return (t.after || []).indexOf(id) >= 0; });
  }
  function winOf(flow, place) { return (flow.windows || {})[place] || null; }
  function winSpan(w) {
    var a = clock(num(w.open)), b = clock(num(w.close));
    return a.slice(-2) === b.slice(-2) ? a.slice(0, -3) + '–' + b : a + '–' + b;
  }

  // ── Drawing ───────────────────────────────────────────────────────────────
  var LANE_H = 38, PAD_T = 14, PAD_B = 18, PLOT_PX = 1040;
  var X = function (h) { return (h / (SPAN * 24)) * 1000; };
  var PCT = function (h) { return (h / (SPAN * 24)) * 100; };

  function chart(flow, r) {
    var lanes = places(flow), yOf = {};
    lanes.forEach(function (l, i) { yOf[l] = PAD_T + i * LANE_H + LANE_H / 2; });
    var H = PAD_T + lanes.length * LANE_H + PAD_B;

    var svg = '', caps = '', busy = {};
    for (var c = 1; c < SPAN; c++) {
      svg += '<line class="col" x1="' + X(c * 24) + '" x2="' + X(c * 24) + '" y1="0" y2="' + H + '"/>';
    }
    r.pts.forEach(function (p) { (busy[p.place] || (busy[p.place] = [])).push(PCT(p.e)); });
    lanes.forEach(function (l, i) {
      var y = PAD_T + i * LANE_H;
      svg += '<line class="lane" x1="0" x2="1000" y1="' + (y + LANE_H / 2) + '" y2="' + (y + LANE_H / 2) + '"/>';
      var w = winOf(flow, l);
      if (!w) return;
      var open = [];
      for (var d = 0; d < SPAN; d++) {
        if (!w.days[(dowIdx(ANCHOR) + d) % 7]) continue;
        open.push(d);
        var x0 = X(d * 24 + num(w.open)), x1 = X(d * 24 + num(w.close));
        svg += '<rect class="band" x="' + x0 + '" width="' + Math.max(0, x1 - x0) +
          '" y="' + (y + 5) + '" height="' + (LANE_H - 10) + '"><title>' + esc(l) + ' open ' +
          winSpan(w) + '</title></rect>';
      }
      if (!open.length) return;
      var mine = busy[l] || [], pick = open[0];
      for (var oi = 0; oi < open.length; oi++) {
        var px = PCT(open[oi] * 24 + num(w.open)), clear = true;
        for (var bi = 0; bi < mine.length; bi++) if (Math.abs(mine[bi] - px) < 15) clear = false;
        if (clear) { pick = open[oi]; break; }
      }
      caps += '<div class="cap" style="left:' + PCT(pick * 24 + num(w.open)) + '%;top:' + (y + 3) + 'px">' +
        esc(l) + ' open</div>';
    });

    // Links first, so a bar always sits on top of the thread that reached it.
    // A link that runs backwards means a task starts before what it comes after
    // has finished, which is allowed and is worth seeing.
    var link = '';
    r.edges.forEach(function (e) {
      if (Math.abs(e.h1 - e.h0) <= .01) return;
      link += '<line class="link' + (e.h1 < e.h0 ? ' back' : '') + '" x1="' + X(e.h0) +
        '" y1="' + yOf[e.p0] + '" x2="' + X(e.h1) + '" y2="' + yOf[e.p0] + '"/>';
    });

    var move = '', wait = '', grabs = '';
    r.pts.forEach(function (p) {
      var y1 = yOf[p.from] === undefined ? yOf[p.place] : yOf[p.from];
      var seg = 'x1="' + X(p.s) + '" y1="' + y1 + '" x2="' + X(p.e) + '" y2="' + yOf[p.place] + '"';
      var still = p.from === p.place;
      if (p.e - p.s > .01 || !still) {
        if (still) wait += '<line class="wait" ' + seg + '/>';
        else move += '<line class="move" ' + seg + '/>';
      }
      svg += '<circle class="tick' + b + '" cx="' + X(p.s) + '" cy="' + y1 + '" r="2.6"><title>' +
        esc(p.t.name) + ' starts ' + stamp(p.s) + '</title></circle>';
      grabs += '<line class="grab" ' + seg + ' data-task="' + esc(p.id) + '"><title>' +
        esc(p.t.name) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' + dur(p.e - p.s) +
        '. Drag to move the whole task.</title></line>';
    });
    svg += link + wait + move + grabs;

    var dots = '', placed = {};
    r.pts.forEach(function (p) {
      var x = PCT(p.e), last = p.e === r.end;
      var nm = p.t.name || 'Task', tm = clock(p.e);
      var wpc = (30 + (nm.length + tm.length) * 5.3) / PLOT_PX * 100;
      var flip = x + wpc > 99;
      var lo = flip ? x - wpc : x, hi = flip ? x : x + wpc;
      var lane = placed[p.place] || (placed[p.place] = []), slot = 0;
      for (; slot < 3; slot++) {
        var free = true;
        for (var q = 0; q < lane.length; q++) {
          var o = lane[q];
          if (o.slot === slot && lo < o.hi + .5 && o.lo < hi + .5) { free = false; break; }
        }
        if (free) break;
      }
      lane.push({ lo: lo, hi: hi, slot: slot });
      var fed = feedsOf(flow, p.id);
      var db = ' b' + ((flow.branches || ['1']).indexOf(p.t.branch || '1') % 4);
      dots += '<div class="dot' + db + ' s' + slot + (last ? ' end' : '') + (flip ? ' flip' : '') +
        '" style="left:' + x + '%;top:' + yOf[p.place] + 'px" data-task="' + esc(p.id) + '"' +
        ' title="' + esc(nm) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' + dur(p.e - p.s) +
        (p.t.note ? '. ' + esc(p.t.note) : '') +
        (fed.length ? '. Feeds ' + esc(fed.map(function (x2) { return x2.name; }).join(', ')) : '') +
        '">' + '<b></b><span>' + ico(p.t.icon) + esc(nm) + '<em>' + tm + '</em></span></div>';
    });

    var lbl = lanes.map(function (l) {
      var w = winOf(flow, l);
      return '<div class="lane-lbl" style="height:' + LANE_H + 'px">' + esc(l) +
        '<button class="win' + (w ? '' : ' off') + '" data-place="' + esc(l) + '">' +
        (w ? winSpan(w) : 'no hours') + '</button></div>';
    }).join('');

    return '<div class="hd"><b>' + esc(flow.name) + '</b><small>' + esc(flow.note || '') + '</small>' +
      '<div class="res"><b>' + r.days + '</b><small>' + (r.days === 1 ? 'day' : 'days') + '</small>' +
      '<em>' + r.hrs + ' h end to end, ' + r.still + ' standing still</em></div></div>' +
      '<div class="chart"><div class="gut" style="padding-top:' + PAD_T + 'px">' + lbl + '</div>' +
      '<div class="plot" style="height:' + H + 'px">' +
      '<svg class="svg" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none">' + svg + '</svg>' +
      caps + dots + '</div></div>';
  }


  // ── Gating on the hours ───────────────────────────────────────────────────
  // The times come from the Markdown, so a window cannot push them about. What
  // it can do is say when a written time falls outside the door it belongs to.
  function nextOpen(w, h) {
    for (var i = 0; i < 28; i++) {
      var d = Math.floor(h / 24) + i, dw = (dowIdx(ANCHOR) + d) % 7;
      if (!w.days[dw]) continue;
      var o = d * 24 + num(w.open), c = d * 24 + num(w.close);
      if (h <= o) return o;
      if (h < c) return h;
    }
    return h;
  }
  function outside(flow, place, h) {
    var w = winOf(flow, place);
    return w ? nextOpen(w, h) !== h : false;
  }
  function offences(flow) {
    var out = [];
    flow.tasks.forEach(function (t) {
      var pl = t.place || 'Somewhere';
      if (!winOf(flow, pl)) return;
      if (outside(flow, pl, num(t.s))) out.push({ t: t, f: 'starts', h: num(t.s), pl: pl });
      if (outside(flow, pl, num(t.e))) out.push({ t: t, f: 'stops', h: num(t.e), pl: pl });
    });
    return out;
  }

  // ── The task list, which is a reading of the Markdown ─────────────────────
  var COLS = ['', '', 'Task', 'Place', 'Starts', 'Stops', 'Takes', 'After', 'Note'];
  function taskTable(flow, r) {
    var body = flow.tasks.map(function (t, i) {
      var p = null;
      r.pts.forEach(function (x) { if (x.id === t.id) p = x; });
      var len = num(t.e) - num(t.s);
      var still = p && p.from === (t.place || 'Somewhere');
      var pre = (t.after || []).filter(function (id) { return r.byId[id]; });
      var badS = outside(flow, t.place || 'Somewhere', num(t.s));
      var badE = outside(flow, t.place || 'Somewhere', num(t.e));
      return '<div class="row' + (len < 0 ? ' bad' : '') + '" id="task-' + esc(t.id) + '">' +
        '<div class="cell n">' + (i + 1) + '</div>' +
        '<div class="cell ico">' + ico(t.icon) + '</div>' +
        '<div class="cell nm">' + esc(t.name) + '</div>' +
        '<div class="cell plc">' + esc(t.place) + '</div>' +
        '<div class="cell tm' + (badS ? ' out' : '') + '"' +
        (badS ? ' title="' + esc(t.place) + ' is shut then."' : '') + '>' + stamp(num(t.s)) + '</div>' +
        '<div class="cell tm' + (badE ? ' out' : '') + '"' +
        (badE ? ' title="' + esc(t.place) + ' is shut then."' : '') + '>' + stamp(num(t.e)) + '</div>' +
        '<div class="cell dur' + (len < 0 ? ' bad' : still && len > .01 ? ' still' : '') + '">' +
        (len < 0 ? 'backwards' : dur(len)) + '</div>' +
        '<div class="cell aft">' + (pre.length
          ? pre.map(function (id) { return esc(r.byId[id].name); }).join(', ') : '—') + '</div>' +
        '<div class="cell nt">' + esc(t.note || '') + '</div>' +
        '</div>';
    }).join('');
    return '<div class="grid">' +
      COLS.map(function (c, i) { return '<div class="gh' + (i === 6 ? ' r' : '') + '">' + c + '</div>'; }).join('') +
      body + '</div>';
  }

  // ── What has to be packed, and how long it takes ──────────────────────────
  // Three case types at three different rates against two destinations, which
  // is the shape the pack line is actually planned in. Cases only: the pack
  // line counts cases, and pounds were a second number nobody was using here.
  var GROUPS = (window.DATA && DATA.pack_groups) || [['LW', 'LW'], ['LF', 'LF'], ['TRAY', 'LR/AR/WR']];
  var DESTS = [['on', 'On-island'], ['off', 'Off-island']];
  // Minutes per case, not cases per minute: a tray takes six minutes, it does
  // not come off the line six at a time.
  var RATE_DEF = { LW: 8, LF: 6, TRAY: 6 };

  function rates() {
    var r = {};
    GROUPS.forEach(function (g) {
      var v = S.rates && S.rates[g[0]];
      r[g[0]] = (v === undefined || v === null || v === '' || +v <= 0) ? RATE_DEF[g[0]] : +v;
    });
    return r;
  }
  function mins(cases, rate) { return cases * rate; }
  function showMins(m) {
    if (!m) return '—';
    if (m < 60) return Math.round(m) + ' min';
    var h = Math.floor(m / 60), mm = Math.round(m - h * 60);
    return h + ' h' + (mm ? ' ' + mm : '');
  }

  function ordersView() {
    var P = (window.DATA && DATA.packs) || [];
    if (!P.length) return '<p class="hint">No pack data in data.json.</p>';
    var R = rates();
    var tot = {}, n = 0;
    DESTS.forEach(function (d) { GROUPS.forEach(function (g) { tot[d[0] + g[0]] = 0; }); });
    P.forEach(function (row) {
      n++;
      DESTS.forEach(function (d) {
        GROUPS.forEach(function (g) { tot[d[0] + g[0]] += (row[d[0]] || {})[g[0]] || 0; });
      });
    });

    // ── The two pack days ────────────────────────────────────────────────
    // Day 1 is a 6.5 hour shift filled in a fixed order: all of Kona's LW,
    // then as much off-island LW as still fits, then all the LF and all the
    // trays for both days. Day 2 is the off-island LW that did not fit.
    var DAY1 = 6.5;
    var LB = { LW: 10.5, LF: 10, TRAY: 2.25 };
    var konaLW = n ? tot.onLW / n : 0;
    var offLW = n ? tot.offLW / n : 0;
    var lf = n ? (tot.onLF + tot.offLF) / n : 0;
    var tray = n ? (tot.onTRAY + tot.offTRAY) / n : 0;
    var hKona = mins(konaLW, R.LW) / 60, hLF = mins(lf, R.LF) / 60, hR = mins(tray, R.TRAY) / 60;
    var room = DAY1 - (hKona + hLF + hR);
    var offLW1 = R.LW > 0 ? Math.max(0, Math.min(offLW, room * 60 / R.LW)) : 0;
    var offLW2 = offLW - offLW1;
    var segs1 = [
      ['Kona LW', konaLW, hKona, konaLW * LB.LW, 'k'],
      ['Off-island LW', offLW1, mins(offLW1, R.LW) / 60, offLW1 * LB.LW, 'o'],
      ['LF', lf, hLF, lf * LB.LF, 'f'],
      ['LR/AR/WR', tray, hR, tray * LB.TRAY, 'r']
    ].filter(function (x) { return x[1] > 0.5; });
    var segs2 = [['Off-island LW', offLW2, mins(offLW2, R.LW) / 60, offLW2 * LB.LW, 'o']]
      .filter(function (x) { return x[1] > 0.5; });
    function dayRow(label, segs, over) {
      var h = segs.reduce(function (a, x) { return a + x[2]; }, 0);
      var lb = segs.reduce(function (a, x) { return a + x[3]; }, 0);
      var wide = Math.max(hKona + hLF + hR + mins(offLW1, R.LW) / 60,
                          mins(offLW2, R.LW) / 60, DAY1) || 1;
      return '<div class="pd"><span class="pd-l">' + label + '</span>' +
        '<span class="pd-bar">' +
        segs.map(function (x) {
          return '<span class="pd-s ' + x[4] + '" style="width:' + (x[2] / wide * 100).toFixed(2) +
            '%" title="' + esc(x[0]) + ' — ' + Math.round(x[1]).toLocaleString() + ' cs, ' +
            showMins(x[2] * 60) + ', ' + Math.round(x[3]).toLocaleString() + ' lb">' +
            (x[2] / wide > .07 ? esc(x[0]) : '') + '</span>';
        }).join('') +
        '<span class="pd-cap" style="left:' + (DAY1 / wide * 100).toFixed(2) + '%"></span>' +
        '</span>' +
        '<span class="pd-h' + (over ? ' over' : '') + '">' + showMins(h * 60) + '</span>' +
        '<span class="pd-lb">' + Math.round(lb).toLocaleString() + ' lb</span></div>';
    }
    var packBar = '<div class="packdays">' +
      dayRow('Pack day 1', segs1, hKona + hLF + hR > DAY1 + .01) +
      dayRow('Pack day 2', segs2, false) +
      '<div class="pd-key">' +
      [['k', 'Kona LW'], ['o', 'Off-island LW'], ['f', 'LF'], ['r', 'LR/AR/WR']].map(function (x) {
        return '<span><i class="pd-sw ' + x[0] + '"></i>' + x[1] + '</span>';
      }).join('') +
      '<span class="pd-note">Dashed line is the ' + DAY1 + ' h day.</span></div></div>';

    var rateRow = '<div class="rates"><span class="lbl">Minutes per case</span>' +
      GROUPS.map(function (g) {
        return '<label class="rate">' + esc(g[1]) +
          '<input type="text" inputmode="numeric" value="' + R[g[0]] +
          '" data-rate="' + g[0] + '"></label>';
      }).join('') + '</div>';

    var body = P.map(function (row, i) {
      var first = i % 2 === 0;
      return '<tr class="' + (first ? 'wkstart' : '') + '">' +
        (first ? '<th rowspan="2" class="wk">' + shortDate(row.wk) + '</th>' : '') +
        '<th class="hf">' + (row.half === 'early' ? 'Sun / Mon' : 'Wed / Thu') + '</th>' +
        DESTS.map(function (d) {
          return GROUPS.map(function (g) {
            var v = (row[d[0]] || {})[g[0]] || 0;
            return '<td class="fig">' + (v ? v.toLocaleString() : '&mdash;') + '</td>';
          }).join('');
        }).join('') + '</tr>';
    }).join('');

    var minRow = '<tr class="minrow"><th></th><th class="hf">Minutes</th>' +
      DESTS.map(function (d) {
        return GROUPS.map(function (g) {
          return '<td class="fig">' + showMins(mins(n ? tot[d[0] + g[0]] / n : 0, R[g[0]])) + '</td>';
        }).join('');
      }).join('') + '</tr>';

    var avg = '<tr class="grp"><th colspan="8">Per window</th></tr>' +
      '<tr><th></th><th class="hf">Average</th>' +
      DESTS.map(function (d) {
        return GROUPS.map(function (g) {
          return '<td class="fig">' + Math.round(n ? tot[d[0] + g[0]] / n : 0).toLocaleString() + '</td>';
        }).join('');
      }).join('') + '</tr>';

    return packBar + rateRow +
      '<table class="otbl orders"><thead>' +
      '<tr><th></th><th></th>' +
      DESTS.map(function (d) { return '<th colspan="3" class="grp2">' + d[1] + '</th>'; }).join('') +
      '</tr><tr class="units"><th></th><th></th>' +
      DESTS.map(function () {
        return GROUPS.map(function (g) { return '<th>' + esc(g[1]) + '</th>'; }).join('');
      }).join('') + '</tr></thead><tbody>' + minRow + body + avg + '</tbody></table>';
  }

  function shortDate(iso) {
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var d = new Date(iso + 'T00:00:00');
    return d.getDate() + ' ' + M[d.getMonth()];
  }

  // ── Hours: everybody's clock, not just this journey's ─────────────────────
  // A window belongs to a party, not to a task, and the ones that matter are
  // the ones this product waits at whether or not the journey on screen goes
  // through them.
  function hoursView() {
    var R = window.REF || { hours: [], sailings: [] };
    var out = '';
    if (R.hours.length) {
      out += '<h4>Who will take it, and when</h4>' +
        '<table class="otbl hrs"><thead><tr><th>Place</th><th>Days</th><th>Opens</th>' +
        '<th>Closes</th><th>After arrival</th><th>Note</th></tr></thead><tbody>' +
        R.hours.map(function (w) {
          return '<tr><th class="hf">' + esc(w.place) + '</th>' +
            '<td class="dcell">' + dayCells(w.days) + '</td>' +
            '<td class="mono">' + clock(num(w.open)) + '</td>' +
            '<td class="mono">' + clock(num(w.close)) + '</td>' +
            '<td class="mono">' + (w.lead ? w.lead + ' h' : '<u>—</u>') + '</td>' +
            '<td class="nt">' + esc(w.note || '') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    if (R.sailings.length) {
      out += '<h4>Young Brothers sailings</h4>' +
        '<table class="otbl hrs"><thead><tr><th>Route</th><th>Departs</th><th>Arrives</th>' +
        '<th>Connects</th><th>Note</th></tr></thead><tbody>' +
        R.sailings.map(function (x) {
          var open = /\?/.test(x.departs) || /\?/.test(x.arrives);
          return '<tr' + (open ? ' class="unk"' : '') + '><th class="hf">' + esc(x.route) + '</th>' +
            '<td class="mono">' + esc(x.departs) + '</td>' +
            '<td class="mono">' + esc(x.arrives) + '</td>' +
            '<td class="nt">' + esc(x.connects || '') + '</td>' +
            '<td class="nt">' + mark(x.note || '') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    // What this journey actually uses, which is a subset and worth seeing apart.
    var flow = cur();
    var pl = flow ? places(flow).filter(function (p) { return winOf(flow, p); }) : [];
    if (pl.length) {
      out += '<h4>Used by ' + esc(flow.name) + '</h4>' +
        '<table class="otbl hrs"><thead><tr><th>Place</th><th>Days</th><th>Opens</th>' +
        '<th>Closes</th><th></th></tr></thead><tbody>' +
        pl.map(function (p) {
          var w = winOf(flow, p);
          return '<tr><th class="hf">' + esc(p) + '</th>' +
            '<td class="dcell">' + dayCells(w.days) + '</td>' +
            '<td class="mono">' + clock(num(w.open)) + '</td>' +
            '<td class="mono">' + clock(num(w.close)) + '</td><td></td></tr>';
        }).join('') + '</tbody></table>';
    }
    return out + '<p class="hint">All of this is set in <code>hours.csv</code> and ' +
      '<code>sailings.csv</code>. Days here are real weekdays, the same as in ' +
      '<code>legs.csv</code>.' + '<span hidden>' +
      'tables at the top of the file, and each journey&rsquo;s own <b>Hours</b> table. Days here are ' +
      '</span></p>';
  }
  function dayCells(days) {
    return DOW.map(function (dn, d) {
      return '<span class="d' + (days[d] ? ' on' : '') + '" title="' + dn + '">' + dn[0] + '</span>';
    }).join('');
  }
  function mark(t) {
    return esc(t).replace(/NOT CONFIRMED/g, '<b class="unconfirmed">Not confirmed</b>');
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var TABS = [['flow', 'Flow'], ['orders', 'Orders'], ['hours', 'Hours']];
  function paint() {
    seg('tabs', TABS, S.tab, function (v) { S.tab = v; save(); paint(); });
    TABS.forEach(function (t) {
      document.getElementById('page-' + t[0]).hidden = t[0] !== S.tab;
    });
    if (S.tab === 'flow') paintFlow();
    if (S.tab === 'orders') paintOrders();
    if (S.tab === 'hours') document.getElementById('hours').innerHTML = hoursView();
  }

  function paintFlow() {
    if (!F.length) {
      document.getElementById('grid').innerHTML = '<p class="hint">No journeys in journeys.csv.</p>';
      return;
    }
    var flow = cur();
    ANCHOR = flow.anchor || 'Sun';

    var r = read(flow);
    SPAN = Math.max(2, Math.ceil(r.end / 24) + 1);

    seg('pick', F.map(function (x) {
      return [x.id, x.name + (x.start ? ' \u00b7 ' + x.start : '')];
    }), S.id, function (v) { S.id = v; save(); paint(); });
    document.getElementById('src').innerHTML =
      'Defined in <code>legs.csv</code> — edit that and run <code>build.py</code>.';

    var ax = '';
    for (var i = 0; i < SPAN; i++) {
      ax += '<div class="day' + (i === 0 ? ' cut' : '') + '">' + dayName(i) + '</div>';
    }
    document.getElementById('axis').innerHTML = '<div class="gut"></div><div class="days">' + ax + '</div>';
    document.getElementById('grid').innerHTML = chart(flow, r);
    document.getElementById('legend').innerHTML =
      '<span><i class="sw band"></i>a green box is one day of that place&rsquo;s opening hours</span>' +
      '<span><i class="sw mv"></i>moving</span>' +
      '<span><i class="sw wt"></i>standing still</span>' +
      '<span><i class="sw tk"></i>where a leg starts</span>' +
      ((flow.branches || []).length > 1
        ? (flow.branches || []).map(function (b, i) {
            return '<span><i class="sw b' + (i % 4) + '"></i>branch ' + esc(b) + '</span>';
          }).join('') : '');

    var off = offences(flow), warn = '';
    if (r.broken.length) {
      warn += '<div class="warn">' + r.broken.map(function (t) { return esc(t.name); }).join(', ') +
        ' stop' + (r.broken.length > 1 ? '' : 's') + ' before ' +
        (r.broken.length > 1 ? 'they' : 'it') + ' start' + (r.broken.length > 1 ? '' : 's') + '.</div>';
    }
    if (off.length) {
      warn += '<div class="warn">' + off.length + ' time' + (off.length > 1 ? 's fall' : ' falls') +
        ' outside the opening hours of the place ' + (off.length > 1 ? 'they belong' : 'it belongs') +
        ' to: ' + off.map(function (o) {
          return esc(o.t.name) + ' ' + o.f + ' ' + stamp(o.h) + ', but ' + esc(o.pl) + ' is open ' +
                 winSpan(winOf(flow, o.pl));
        }).join('; ') + '.</div>';
    }
    document.getElementById('warn').innerHTML = warn;
    document.getElementById('tnote').textContent =
      flow.tasks.length + ' legs · ' + (flow.branches || []).length + ' branches · ' +
      places(flow).length + ' places · ' + r.hrs + ' h end to end, ' + r.still + ' standing still';
    document.getElementById('tasks').innerHTML = taskTable(flow, r);
    document.getElementById('sub').textContent = flow.note ||
      'Time runs across, place runs down — so a sloped bar is movement and a flat one is waiting.';

    // A bar or a dot finds its row, which is the only interaction left.
    all('#grid [data-task]').forEach(function (el) {
      el.addEventListener('click', function () {
        var c = document.getElementById('task-' + el.getAttribute('data-task'));
        if (!c) return;
        c.classList.add('lit');
        c.scrollIntoView({ block: 'center' });
        window.setTimeout(function () { c.classList.remove('lit'); }, 2600);
      });
    });
  }

  function paintOrders() {
    document.getElementById('onote').textContent =
      'Lettuce · ' + (DATA.window ? DATA.window.first + ' to ' + DATA.window.last : '') +
      ' · copied from the freight model';
    var host = document.getElementById('orders');
    host.innerHTML = ordersView();
    // Delegated, and bound once. A rate change repaints the whole view, so a
    // handler holding its own input goes on reading the element it replaced.
    if (!host.__wired) {
      host.__wired = true;
      host.addEventListener('input', function (ev) {
        var inp = ev.target;
        if (!inp || !inp.getAttribute || !inp.getAttribute('data-rate')) return;
        var key = inp.getAttribute('data-rate'), v = parseFloat(inp.value), pos = inp.selectionStart;
        S.rates = S.rates || {};
        S.rates[key] = isNaN(v) || v <= 0 ? '' : v;
        save();
        host.innerHTML = ordersView();
        var again = host.querySelector('[data-rate="' + key + '"]');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
  }

  function seg(id, opts, sel, cb) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = opts.map(function (o) {
      return '<a data-v="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' class="on"' : '') +
        '>' + esc(o[1]) + '</a>';
    }).join('');
    [].slice.call(el.querySelectorAll('a')).forEach(function (a) {
      a.onclick = function () { cb(a.getAttribute('data-v')); };
    });
  }

  paint();
})();

</script>
</body>
</html>
