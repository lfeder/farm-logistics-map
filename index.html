<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Vis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: only light;
  --ground:#eef1f3; --card:#ffffff; --card-2:#f6f8f9;
  --ink:#141b1f; --ink-2:#4a5860; --ink-3:#78878f;
  --line:#d8dfe3; --line-2:#e8edef;
  --accent:#d4541f; --accent-soft:#fbeee7;
  --good:#1d7a52; --bad:#b3341c;
  --band:#e8f2ec; --band-2:#cfe3d8;
  --shadow:0 1px 2px rgba(20,27,31,.06), 0 8px 24px -12px rgba(20,27,31,.18);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:32px 24px 80px; display:flex; flex-direction:column; gap:24px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 28px;
  border-bottom:2px solid var(--ink); padding-bottom:16px}
h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.02em}
.sub{color:var(--ink-2); font-size:14px; margin:2px 0 0}
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
.panel-hd{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:13px 18px;
  border-bottom:1px solid var(--line-2)}
.panel-hd h2{margin:0; font-size:12px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600}
.lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.note{font-size:11.5px; color:var(--ink-3)}
.btn{background:none; border:1px solid var(--line); color:var(--ink-2); font:inherit; font-size:12px;
  padding:4px 12px; border-radius:6px; cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.solid{background:var(--ink); border-color:var(--ink); color:var(--card); font-weight:600}
.btn.solid:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg a{padding:5px 12px; font-size:12.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
  border-left:1px solid var(--line)}
.seg a:first-child{border-left:none}
.seg a.on{background:var(--accent); color:#fff; font-weight:600}
.seg a:hover:not(.on){background:var(--card-2)}

/* ---------- the chart: time across, place down ---------- */
.body{padding:14px 18px 14px}
.axis{display:flex; gap:12px; padding-bottom:2px}
.gut{flex:0 0 128px; display:flex; flex-direction:column}
.days{flex:1 1 auto; min-width:0; display:flex}
.day{flex:1 1 0; text-align:center; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; border-left:1px solid var(--line-2); padding-bottom:3px}
.day:first-child{border-left:none}
.day.cut{color:var(--accent)}
.hd{display:flex; align-items:baseline; gap:9px; padding:2px 0 4px}
.hd b{font-size:14.5px; font-weight:600}
.hd small{font-size:10.5px; color:var(--ink-3)}
.res{margin-left:auto; display:flex; align-items:baseline; gap:5px}
.res b{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; line-height:1}
.res small{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.res em{font-style:normal; font-size:10.5px; color:var(--ink-3)}
.chart{display:flex; gap:12px}
.lane-lbl{display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  font-size:10.5px; font-weight:600; color:var(--ink-2); line-height:1.15; text-align:right}
.lane-lbl button{margin-top:2px; padding:1px 5px; border:1px solid var(--band-2); border-radius:4px;
  background:var(--band); color:var(--good); font-family:"IBM Plex Mono",monospace;
  font-size:9px; font-weight:600; white-space:nowrap; cursor:pointer}
.lane-lbl button.off{background:var(--card-2); border-color:var(--line); color:var(--ink-3)}
.lane-lbl button:hover{border-color:var(--accent); color:var(--accent)}
.plot{position:relative; flex:1 1 auto; min-width:0}
.svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.svg line{vector-effect:non-scaling-stroke}
.lane{stroke:var(--line-2); stroke-width:1}
.col{stroke:var(--line-2); stroke-width:1}
.band{fill:var(--band)}
.cap{position:absolute; font-size:8.5px; font-weight:600; color:var(--good);
  white-space:nowrap; padding-left:3px; pointer-events:none; opacity:.85}
.move{stroke:var(--ink); stroke-width:2; stroke-linecap:round}
.wait{stroke:var(--ink); stroke-width:2; stroke-dasharray:2 3; opacity:.6}
/* A prereq's stop and the next start need not meet. Where they do not, the gap
   is drawn for what it is rather than closed up. */
.link{stroke:var(--ink-3); stroke-width:1.5; stroke-dasharray:1 4; opacity:.75}
.link.back{stroke:var(--bad); opacity:.9; stroke-dasharray:3 3}
.tick{fill:var(--card); stroke:var(--ink); stroke-width:1.5}
.grab{stroke:transparent; stroke-width:13; stroke-linecap:round; cursor:ew-resize}
.grab:hover{stroke:var(--accent); opacity:.22}
.dot{position:absolute; width:0; height:0; color:var(--ink); cursor:pointer}
.dot b{position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50%;
  background:currentColor; display:block}
.dot.end b{left:-4.5px; top:-4.5px; width:9px; height:9px; box-shadow:0 0 0 2px var(--card)}
.dot span{position:absolute; left:7px; display:flex; align-items:center; gap:3px; white-space:nowrap;
  font-size:9.5px; font-weight:500; line-height:1.1}
.dot.s0 span{bottom:2px} .dot.s1 span{top:2px} .dot.s2 span{bottom:13px}
.dot.flip span{left:auto; right:7px; flex-direction:row-reverse}
.dot em{font-style:normal; color:var(--ink-3); font-weight:400}
.dot.end span{font-weight:600}
.dot:hover b{box-shadow:0 0 0 3px var(--accent-soft)}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding-top:14px; margin-top:10px;
  border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.sw{display:inline-block; width:11px; height:11px; border-radius:2px}
.sw.band{background:var(--band); border:1px solid var(--band-2)}
.sw.mv{width:16px; height:2px; border-radius:0; background:var(--ink-2)}
.sw.wt{width:16px; height:0; border-radius:0; border-top:2px dashed var(--ink-3)}
.sw.tk{width:7px; height:7px; border-radius:50%; background:var(--card); border:1.5px solid var(--ink)}
.i{display:inline-block; vertical-align:-2px; flex:0 0 auto}

/* ---------- the list ---------- */
/* Every task carries the same fields, so every row is the same grid and the
   columns line up down the page. That is only possible because a task now says
   when it starts and when it stops outright, rather than each kind of task
   needing its own controls. */
.tasks{padding:0 18px 18px}
.grid{display:grid; gap:0 8px; align-items:center;
  grid-template-columns:
    22px 24px minmax(120px,1fr) minmax(88px,150px)
    62px 92px 62px 92px 52px auto 22px 22px 22px 22px;}
.gh{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding:10px 0 6px; border-bottom:1px solid var(--line); white-space:nowrap}
.gh.r{text-align:right}
.row{display:contents}
.row>*{min-width:0}
.cell{padding:4px 0; border-bottom:1px solid var(--line-2); height:100%;
  display:flex; align-items:center; gap:3px}
.row.lit .cell{background:var(--accent-soft)}
.row.bad .cell{background:var(--accent-soft)}
.n{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); font-weight:600;
  justify-content:flex-end; padding-right:3px}
.ico{cursor:pointer; color:var(--ink-2); justify-content:center}
.ico:hover{color:var(--accent)}
.dur{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  justify-content:flex-end; white-space:nowrap}
/* A task that stops where it started is standing still, and that is the one
   thing on this screen worth spotting from across the room. */
.dur.still{color:var(--accent); font-weight:600}
.dur.bad{color:var(--bad); font-weight:600}
.noterow input:focus{outline:none; border-color:var(--accent); background:var(--card)}
.warn{margin:12px 18px 0; padding:9px 12px; border:1px solid var(--bad); border-radius:7px;
  background:var(--accent-soft); color:var(--bad); font-size:12.5px}

/* ---------- opening hours, which belong to a place ---------- */
/* A window is a fact about a door, not about a task: Costco receiving is open
   4 to 11 whether or not anything is driving towards it. */
.dcell{display:inline-flex; gap:1px}
.d{width:17px; height:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-3);
  font-family:inherit; font-size:9.5px; font-weight:600; border-radius:3px; cursor:pointer; padding:0}
.d.on{background:var(--good); border-color:var(--good); color:#fff}
.d:hover{border-color:var(--accent)}
@media (max-width:1150px){ .tasks{overflow-x:auto} .grid{min-width:1120px} }

/* ---------- tabs ---------- */
.tabs{margin-left:auto}
.page{display:flex; flex-direction:column; gap:24px}
.page[hidden]{display:none}
code{font-family:"IBM Plex Mono",monospace; font-size:.92em; background:var(--card-2);
  border:1px solid var(--line-2); border-radius:4px; padding:0 4px}

/* ---------- the task list, now a reading rather than a form ---------- */
.grid{display:grid; gap:0 10px; align-items:center;
  grid-template-columns:22px 24px minmax(130px,1.2fr) minmax(90px,.8fr)
    118px 118px 62px minmax(90px,.9fr) minmax(0,1.6fr);}
.cell{padding:6px 0; border-bottom:1px solid var(--line-2); height:100%;
  display:flex; align-items:center; min-width:0}
.cell.nm{font-weight:600; font-size:13px}
.cell.plc{font-size:12.5px; color:var(--ink-2)}
.cell.tm{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2)}
.cell.tm.out{color:var(--bad); font-weight:600}
.cell.aft{font-size:11.5px; color:var(--ink-3)}
.cell.nt{font-size:11.5px; color:var(--ink-3); line-height:1.35; padding-right:2px}
.cell.nt em{font-style:normal; color:var(--ink-3)}
.row.lit .cell{background:var(--accent-soft)}
.row.bad .cell{background:var(--accent-soft)}
.tasks{padding:0 18px 18px}

/* ---------- orders and hours ---------- */
.otbl{width:100%; border-collapse:collapse}
.otbl th,.otbl td{text-align:right; padding:5px 10px 5px 0; white-space:nowrap; border:none}
.otbl thead th{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding-bottom:6px; border-bottom:2px solid var(--ink)}
.otbl tbody th{text-align:left; font-size:12px; font-weight:600; color:var(--ink-2)}
.otbl th.wk{vertical-align:middle; font-family:"IBM Plex Mono",monospace; font-size:11px}
.otbl th.hf{font-weight:500; color:var(--ink-3); font-size:11.5px}
.otbl tr.wkstart th,.otbl tr.wkstart td{border-top:1px solid var(--line-2)}
.otbl tr.grp th{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  border-top:2px solid var(--ink); padding-top:10px; text-align:left}
.otbl td b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:14px; font-weight:600; color:var(--ink)}
.otbl td s{text-decoration:none; margin-left:4px; font-family:"IBM Plex Mono",monospace;
  font-size:10px; color:var(--ink-3)}
.otbl td u{text-decoration:none; color:var(--ink-3); font-size:14px}
.otbl .barcell{width:110px; padding-right:0}
.obar{display:block; height:9px; margin-left:auto; background:var(--band);
  border-right:2px solid var(--band-2)}
.otbl.hrs td.dcell,.otbl.hrs td.mono,.otbl.hrs td.nt{text-align:left}
.otbl.hrs .mono{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2)}
.otbl.hrs .d{display:inline-block; width:17px; height:20px; line-height:19px; text-align:center;
  border:1px solid var(--line); border-radius:3px; background:var(--card); color:var(--ink-3);
  font-size:9.5px; font-weight:600; margin-right:1px}
.otbl.hrs .d.on{background:var(--good); border-color:var(--good); color:#fff}
.body h4{margin:18px 0 8px; font-size:11px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600}
.body h4:first-child{margin-top:0}
.hint{margin:14px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.5}
.hint b{color:var(--ink-2); font-weight:600}

/* Cases and pounds share a column and a type size. The orders come in cases and
   the harvest is weighed, so a line carrying only one of them makes somebody
   convert -- but neither is the headline, so neither gets to be bigger. Fixed
   slots keep both columns of figures running straight down the page. */
.q{display:inline-flex; justify-content:flex-end; gap:12px;
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:11.5px}
.otbl .q s{text-decoration:none; display:inline-block; text-align:right; color:var(--ink);
  margin:0; font-size:11.5px}
.otbl .q s.cs{width:58px}
.otbl .q s.lb{width:70px}
.q i{font-style:normal; color:var(--ink-3); font-size:10px; margin-left:4px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Task Vis</h1>
      <p class="sub" id="sub">Time runs across, place runs down — so a sloped bar is movement and a flat one is waiting.</p>
    </div>
    <nav class="seg tabs" id="tabs"></nav>
  </header>

  <!-- Flow -->
  <section class="page" id="page-flow">
    <div class="panel">
      <div class="panel-hd">
        <h2>Journey</h2>
        <span class="seg" id="pick"></span>
        <span class="lbl">Day 0</span>
        <span class="seg" id="day"></span>
        <span class="note" id="src" style="margin-left:auto"></span>
      </div>
      <div class="body">
        <div class="axis" id="axis"></div>
        <div id="grid"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><h2>Tasks</h2><span class="note" id="tnote"></span></div>
      <div id="warn"></div>
      <div class="tasks" id="tasks"></div>
    </div>
  </section>

  <!-- Orders -->
  <section class="page" id="page-orders" hidden>
    <div class="panel">
      <div class="panel-hd">
        <h2>Orders by destination</h2>
        <span class="seg" id="ocrop"></span>
        <span class="note" id="onote" style="margin-left:auto"></span>
      </div>
      <div class="body"><div id="orders"></div></div>
    </div>
  </section>

  <!-- Hours -->
  <section class="page" id="page-hours" hidden>
    <div class="panel">
      <div class="panel-hd">
        <h2>Opening hours</h2>
        <span class="note">A window belongs to a place, not to a task — Costco receiving is open 4 to 11 whether or not anything is driving towards it.</span>
      </div>
      <div class="body"><div id="hours"></div></div>
    </div>
  </section>
</div>

      grabs += '<line class="grab" ' + seg + ' data-task="' + esc(p.id) + '"><title>' +
        esc(p.t.name) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' + dur(p.e - p.s) +
        '. Drag to move the whole task.</title></line>';
    });
    svg += link + wait + move + grabs;

    var dots = '', placed = {};
    r.pts.forEach(function (p) {
      var x = PCT(p.e), last = p.e === r.end;
      var nm = p.t.name || 'Task', tm = clock(p.e);
      var wpc = (30 + (nm.length + tm.length) * 5.3) / PLOT_PX * 100;
      var flip = x + wpc > 99;
      var lo = flip ? x - wpc : x, hi = flip ? x : x + wpc;
      var lane = placed[p.place] || (placed[p.place] = []), slot = 0;
      for (; slot < 3; slot++) {
        var free = true;
        for (var q = 0; q < lane.length; q++) {
          var o = lane[q];
          if (o.slot === slot && lo < o.hi + .5 && o.lo < hi + .5) { free = false; break; }
        }
        if (free) break;
      }
      lane.push({ lo: lo, hi: hi, slot: slot });
      var fed = feedsOf(flow, p.id);
      dots += '<div class="dot s' + slot + (last ? ' end' : '') + (flip ? ' flip' : '') +
        '" style="left:' + x + '%;top:' + yOf[p.place] + 'px" data-task="' + esc(p.id) + '"' +
        ' title="' + esc(nm) + ' — ' + stamp(p.s) + ' to ' + stamp(p.e) + ', ' + dur(p.e - p.s) +
        (p.t.note ? '. ' + esc(p.t.note) : '') +
        (fed.length ? '. Feeds ' + esc(fed.map(function (x2) { return x2.name; }).join(', ')) : '') +
        '">' + '<b></b><span>' + ico(p.t.icon) + esc(nm) + '<em>' + tm + '</em></span></div>';
    });

    var lbl = lanes.map(function (l) {
      var w = winOf(flow, l);
      return '<div class="lane-lbl" style="height:' + LANE_H + 'px">' + esc(l) +
        '<button class="win' + (w ? '' : ' off') + '" data-place="' + esc(l) + '">' +
        (w ? winSpan(w) : 'no hours') + '</button></div>';
    }).join('');

    return '<div class="hd"><b>' + esc(flow.name) + '</b><small>' + esc(flow.note || '') + '</small>' +
      '<div class="res"><b>' + r.days + '</b><small>' + (r.days === 1 ? 'day' : 'days') + '</small>' +
      '<em>' + r.hrs + ' h end to end, ' + r.still + ' standing still</em></div></div>' +
      '<div class="chart"><div class="gut" style="padding-top:' + PAD_T + 'px">' + lbl + '</div>' +
      '<div class="plot" style="height:' + H + 'px">' +
      '<svg class="svg" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none">' + svg + '</svg>' +
      caps + dots + '</div></div>';
  }


  // ── Gating on the hours ───────────────────────────────────────────────────
  // The times come from the Markdown, so a window cannot push them about. What
  // it can do is say when a written time falls outside the door it belongs to.
  function nextOpen(w, h) {
    for (var i = 0; i < 28; i++) {
      var d = Math.floor(h / 24) + i, dw = (dowIdx(ANCHOR) + d) % 7;
      if (!w.days[dw]) continue;
      var o = d * 24 + num(w.open), c = d * 24 + num(w.close);
      if (h <= o) return o;
      if (h < c) return h;
    }
    return h;
  }
  function outside(flow, place, h) {
    var w = winOf(flow, place);
    return w ? nextOpen(w, h) !== h : false;
  }
  function offences(flow) {
    var out = [];
    flow.tasks.forEach(function (t) {
      var pl = t.place || 'Somewhere';
      if (!winOf(flow, pl)) return;
      if (outside(flow, pl, num(t.s))) out.push({ t: t, f: 'starts', h: num(t.s), pl: pl });
      if (outside(flow, pl, num(t.e))) out.push({ t: t, f: 'stops', h: num(t.e), pl: pl });
    });
    return out;
  }

  // ── The task list, which is a reading of the Markdown ─────────────────────
  var COLS = ['', '', 'Task', 'Place', 'Starts', 'Stops', 'Takes', 'After', 'Note'];
  function taskTable(flow, r) {
    var body = flow.tasks.map(function (t, i) {
      var p = null;
      r.pts.forEach(function (x) { if (x.id === t.id) p = x; });
      var len = num(t.e) - num(t.s);
      var still = p && p.from === (t.place || 'Somewhere');
      var pre = (t.after || []).filter(function (id) { return r.byId[id]; });
      var badS = outside(flow, t.place || 'Somewhere', num(t.s));
      var badE = outside(flow, t.place || 'Somewhere', num(t.e));
      return '<div class="row' + (len < 0 ? ' bad' : '') + '" id="task-' + esc(t.id) + '">' +
        '<div class="cell n">' + (i + 1) + '</div>' +
        '<div class="cell ico">' + ico(t.icon) + '</div>' +
        '<div class="cell nm">' + esc(t.name) + '</div>' +
        '<div class="cell plc">' + esc(t.place) + '</div>' +
        '<div class="cell tm' + (badS ? ' out' : '') + '"' +
        (badS ? ' title="' + esc(t.place) + ' is shut then."' : '') + '>' + stamp(num(t.s)) + '</div>' +
        '<div class="cell tm' + (badE ? ' out' : '') + '"' +
        (badE ? ' title="' + esc(t.place) + ' is shut then."' : '') + '>' + stamp(num(t.e)) + '</div>' +
        '<div class="cell dur' + (len < 0 ? ' bad' : still && len > .01 ? ' still' : '') + '">' +
        (len < 0 ? 'backwards' : dur(len)) + '</div>' +
        '<div class="cell aft">' + (pre.length
          ? pre.map(function (id) { return esc(r.byId[id].name); }).join(', ') : '—') + '</div>' +
        '<div class="cell nt">' + esc(t.note || '') + '</div>' +
        '</div>';
    }).join('');
    return '<div class="grid">' +
      COLS.map(function (c, i) { return '<div class="gh' + (i === 6 ? ' r' : '') + '">' + c + '</div>'; }).join('') +
      body + '</div>';
  }

  // ── Orders by destination ─────────────────────────────────────────────────
  // Three ways an order leaves the farm, off the purchase orders, so it owes
  // nothing to whether anybody built a pallet for it.
  var BUCKETS = [['kona', 'Costco Kona'], ['pickup', 'Pick up'], ['off', 'Off-island']];
  function ordersView() {
    var c = S.crop, rows = {}, weeks = {};
    (DATA.sales || []).forEach(function (x) {
      if (x.crop !== c) return;
      var k = x.wk + '|' + x.half;
      var R = rows[k] || (rows[k] = {});
      R[x.bucket] = (R[x.bucket] || 0) + (x.cases || 0);
      R[x.bucket + '_lb'] = (R[x.bucket + '_lb'] || 0) + (x.lbs || 0);
      weeks[x.wk] = 1;
    });
    var wks = Object.keys(weeks).sort();
    var HALF = [['early', 'Sun / Mon'], ['late', 'Wed / Thu']];
    var best = 0;
    wks.forEach(function (w) {
      HALF.forEach(function (h) {
        var b = rows[w + '|' + h[0]];
        if (b) best = Math.max(best, (b.kona_lb || 0) + (b.pickup_lb || 0) + (b.off_lb || 0));
      });
    });
    // Orders arrive in cases and the harvest is weighed, so both units belong on
    // every line rather than somebody converting in their head. They share one
    // column and one type size -- neither is the headline -- and each sits in a
    // fixed-width slot so both run straight down the page.
    function qty(b, k) {
      if (!b || !b[k]) return '<span class="q"><s class="cs">&mdash;</s><s class="lb"></s></span>';
      return '<span class="q">' +
        '<s class="cs">' + Math.round(b[k]).toLocaleString() + '<i>cs</i></s>' +
        '<s class="lb">' + Math.round(b[k + '_lb'] || 0).toLocaleString() + '<i>lb</i></s></span>';
    }
    var tot = { kona: 0, pickup: 0, off: 0, kona_lb: 0, pickup_lb: 0, off_lb: 0, n: 0 };
    var body = wks.map(function (w) {
      return HALF.map(function (h, hi) {
        var b = rows[w + '|' + h[0]] || null;
        if (b) {
          BUCKETS.forEach(function (k) {
            tot[k[0]] += b[k[0]] || 0; tot[k[0] + '_lb'] += b[k[0] + '_lb'] || 0;
          });
          tot.n++;
        }
        var sum = b ? (b.kona_lb || 0) + (b.pickup_lb || 0) + (b.off_lb || 0) : 0;
        var bar = sum && best ? '<span class="obar" style="width:' + (sum / best * 100).toFixed(1) + '%"></span>' : '';
        return '<tr class="' + (hi ? '' : 'wkstart') + '">' +
          (hi ? '' : '<th rowspan="2" class="wk">' + shortDate(w) + '</th>') +
          '<th class="hf">' + h[1] + '</th>' +
          BUCKETS.map(function (k) { return '<td>' + qty(b, k[0]) + '</td>'; }).join('') +
          '<td class="barcell">' + bar + '</td></tr>';
      }).join('');
    }).join('');
    var mean = {};
    BUCKETS.forEach(function (k) {
      mean[k[0]] = tot.n ? tot[k[0]] / tot.n : 0;
      mean[k[0] + '_lb'] = tot.n ? tot[k[0] + '_lb'] / tot.n : 0;
    });
    var avg = '<tr class="grp"><th colspan="6">Per window</th></tr><tr><th></th><th class="hf">Average</th>' +
      BUCKETS.map(function (k) { return '<td>' + qty(mean, k[0]) + '</td>'; }).join('') +
      '<td class="barcell"></td></tr>';
    return '<table class="otbl"><thead><tr><th></th><th></th>' +
      BUCKETS.map(function (k) { return '<th>' + k[1] + '</th>'; }).join('') +
      '<th></th></tr></thead><tbody>' + body + avg + '</tbody></table>' +
      '<p class="hint">Cases and pounds invoiced, off the purchase orders, split by how the order ' +
      'leaves the farm: ' +
      '<b>' + esc(DATA.on_island_customer || 'Kona') + '</b> on our own trucks, <b>pick up</b> at the gate ' +
      'under FOB Farm, and <b>off-island</b> on a boat. ' +
      'The freight manifest cannot answer this — it misses more than half of Kona, because it only holds ' +
      'what somebody built a pallet for, and it has no notion of pick-up at all.</p>';
  }
  function shortDate(iso) {
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var d = new Date(iso + 'T00:00:00');
    return d.getDate() + ' ' + M[d.getMonth()];
  }

  // ── Opening hours, every place across every journey ───────────────────────
  function hoursView() {
    var seen = {};
    var out = F.map(function (flow) {
      var pl = places(flow).filter(function (p) { return winOf(flow, p); });
      if (!pl.length) return '';
      return '<h4>' + esc(flow.name) + '</h4><table class="otbl hrs"><thead><tr>' +
        '<th>Place</th><th>Days</th><th>Opens</th><th>Closes</th><th></th></tr></thead><tbody>' +
        pl.map(function (p) {
          var w = winOf(flow, p);
          var key = p + '|' + w.days.join('') + '|' + w.open + '|' + w.close;
          var dup = seen[key] ? ' <em>same as above</em>' : '';
          seen[key] = 1;
          return '<tr><th class="hf">' + esc(p) + '</th>' +
            '<td class="dcell">' + DOW.map(function (dn, d) {
              return '<span class="d' + (w.days[d] ? ' on' : '') + '" title="' + dn + '">' + dn[0] + '</span>';
            }).join('') + '</td>' +
            '<td class="mono">' + clock(num(w.open)) + '</td>' +
            '<td class="mono">' + clock(num(w.close)) + '</td>' +
            '<td class="nt">' + dup + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).join('');
    return out + '<p class="hint">Set in <code>journeys.md</code> under each journey&rsquo;s ' +
      '<b>Hours</b> table. These are real weekdays — Costco receiving is shut on a Sunday whatever ' +
      'day we cut on — where the task times are offsets from the cut.</p>';
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var TABS = [['flow', 'Flow'], ['orders', 'Orders'], ['hours', 'Hours']];
  function paint() {
    seg('tabs', TABS, S.tab, function (v) { S.tab = v; save(); paint(); });
    TABS.forEach(function (t) {
      document.getElementById('page-' + t[0]).hidden = t[0] !== S.tab;
    });
    if (S.tab === 'flow') paintFlow();
    if (S.tab === 'orders') paintOrders();
    if (S.tab === 'hours') document.getElementById('hours').innerHTML = hoursView();
  }

  function paintFlow() {
    if (!F.length) {
      document.getElementById('grid').innerHTML = '<p class="hint">No journeys in journeys.md.</p>';
      return;
    }
    var flow = cur();
    if (flow.days.indexOf(S.day) < 0) S.day = flow.days[0];
    ANCHOR = S.day;

    var r = read(flow);
    SPAN = Math.max(2, Math.ceil(r.end / 24) + 1);

    seg('pick', F.map(function (x) { return [x.id, x.name]; }), S.id,
      function (v) { S.id = v; save(); paint(); });
    seg('day', flow.days.map(function (d) { return [d, d]; }), S.day,
      function (v) { S.day = v; save(); paint(); });
    document.getElementById('src').innerHTML =
      'Defined in <code>journeys.md</code> — edit that and run <code>build.py</code>.';

    var ax = '';
    for (var i = 0; i < SPAN; i++) {
      ax += '<div class="day' + (i === 0 ? ' cut' : '') + '">' + dayName(i) + '</div>';
    }
    document.getElementById('axis').innerHTML = '<div class="gut"></div><div class="days">' + ax + '</div>';
    document.getElementById('grid').innerHTML = chart(flow, r);
    document.getElementById('legend').innerHTML =
      '<span><i class="sw band"></i>a green box is one day of that place&rsquo;s opening hours</span>' +
      '<span><i class="sw mv"></i>moving</span>' +
      '<span><i class="sw wt"></i>standing still</span>' +
      '<span><i class="sw tk"></i>where a task starts</span>';

    var off = offences(flow), warn = '';
    if (r.broken.length) {
      warn += '<div class="warn">' + r.broken.map(function (t) { return esc(t.name); }).join(', ') +
        ' stop' + (r.broken.length > 1 ? '' : 's') + ' before ' +
        (r.broken.length > 1 ? 'they' : 'it') + ' start' + (r.broken.length > 1 ? '' : 's') + '.</div>';
    }
    if (off.length) {
      warn += '<div class="warn">' + off.length + ' time' + (off.length > 1 ? 's fall' : ' falls') +
        ' outside the opening hours of the place ' + (off.length > 1 ? 'they belong' : 'it belongs') +
        ' to: ' + off.map(function (o) {
          return esc(o.t.name) + ' ' + o.f + ' ' + stamp(o.h) + ', but ' + esc(o.pl) + ' is open ' +
                 winSpan(winOf(flow, o.pl));
        }).join('; ') + '.</div>';
    }
    document.getElementById('warn').innerHTML = warn;
    document.getElementById('tnote').textContent =
      flow.tasks.length + ' tasks · ' + places(flow).length + ' places · ' + r.edges.length +
      ' links · ' + r.hrs + ' h end to end, ' + r.still + ' standing still';
    document.getElementById('tasks').innerHTML = taskTable(flow, r);
    document.getElementById('sub').textContent = flow.note ||
      'Time runs across, place runs down — so a sloped bar is movement and a flat one is waiting.';

    // A bar or a dot finds its row, which is the only interaction left.
    all('#grid [data-task]').forEach(function (el) {
      el.addEventListener('click', function () {
        var c = document.getElementById('task-' + el.getAttribute('data-task'));
        if (!c) return;
        c.classList.add('lit');
        c.scrollIntoView({ block: 'center' });
        window.setTimeout(function () { c.classList.remove('lit'); }, 2600);
      });
    });
  }

  function paintOrders() {
    var crops = {};
    (DATA.sales || []).forEach(function (x) { crops[x.crop] = 1; });
    var opts = Object.keys(crops).sort().map(function (c) {
      return [c, c === 'cuke' ? 'Cucumbers' : c.charAt(0).toUpperCase() + c.slice(1)];
    });
    if (!opts.length) {
      document.getElementById('orders').innerHTML = '<p class="hint">No order data in data.json.</p>';
      return;
    }
    if (!crops[S.crop]) S.crop = opts[0][0];
    seg('ocrop', opts, S.crop, function (v) { S.crop = v; save(); paint(); });
    document.getElementById('onote').textContent =
      (DATA.window ? DATA.window.first + ' to ' + DATA.window.last : '') +
      ' · copied from the freight model';
    document.getElementById('orders').innerHTML = ordersView();
  }

  function seg(id, opts, sel, cb) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = opts.map(function (o) {
      return '<a data-v="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' class="on"' : '') +
        '>' + esc(o[1]) + '</a>';
    }).join('');
    [].slice.call(el.querySelectorAll('a')).forEach(function (a) {
      a.onclick = function () { cb(a.getAttribute('data-v')); };
    });
  }

  paint();
})();

</script>
</body>
</html>
